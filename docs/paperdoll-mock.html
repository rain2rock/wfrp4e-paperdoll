<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperdoll Mock</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  html, body { margin: 0; background: #2f3237; font-family: "Signika", "Segoe UI", system-ui, sans-serif; }
  body { padding: 20px; }
  .mock-note { color: #cfcfcf; font-size: 13px; margin: 0 0 12px; max-width: 960px; line-height: 1.4; }
  #mock-reopen { margin-bottom: 12px; }
  .app.window-app { max-width: 100%; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); border: 1px solid #000; }
  .window-header { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 12px; background: #0b0a09;
    color: #e8dcc4; font-size: 14px; border-bottom: 1px solid #4a4339; flex: 0 0 auto; }
  .window-header .window-title { flex: 1; }
  .window-header .header-control { background: none; border: none; color: #e8dcc4; cursor: pointer; font-size: 14px; }
  .window-content { flex: 1; min-height: 0; }
  .mock-toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 4px;
    font-size: 13px; z-index: 20000; color: #fff; background: #6a1c14; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .mock-toast--info { background: #2b3a55; }
  @media (max-width: 760px) {
    body { padding: 8px; }
    .app.window-app { height: auto !important; }
    .wfrp-paperdoll .pd-root { grid-template-columns: 1fr; }
    .wfrp-paperdoll .pd-side { min-height: 360px; border-left: none; border-top: 1px solid #4a4339; }
  }
/* ==========================================================
   WFRP4e Paperdoll - окно персонажа в стиле WoW
   ========================================================== */

.wfrp-paperdoll,
.wfrp-paperdoll-tooltip,
.wfrp-paperdoll-flyout {
  --pd-bg: #0f0d0b;
  --pd-bg-2: #1a1612;
  --pd-panel: #15120f;
  --pd-frame: #4a4339;
  --pd-frame-hi: #6e6556;
  --pd-gold: #ffd100;
  --pd-gold-soft: #c9a45c;
  --pd-text: #f0e6d2;
  --pd-text-dim: #a89c86;

  --pd-up: #1eff00;
  --pd-down: #ff3b30;
  --pd-fate: #69ccf0;
  --pd-chaos: #c26cff;
  --pd-melee: #ff9a5a;

  /* Цвета редкости как в WoW */
  --rarity-none: #9d9d9d;
  --rarity-common: #ffffff;
  --rarity-scarce: #1eff00;
  --rarity-rare: #0070dd;
  --rarity-exotic: #a335ee;
}

.wfrp-paperdoll .window-content {
  padding: 0;
  background: radial-gradient(ellipse at 40% 35%, #231c15 0%, var(--pd-bg) 75%), var(--pd-bg);
  color: var(--pd-text);
  overflow: hidden;
}

.wfrp-paperdoll .pd-root {
  display: grid;
  grid-template-columns: minmax(560px, 1fr) minmax(260px, 300px);
  height: 100%;
  min-height: 0;
}

/* ---------- Шапка с портретом ---------- */

.wfrp-paperdoll .pd-main {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}

.wfrp-paperdoll .pd-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(180deg, #1d1813, #110e0b);
  border-bottom: 1px solid var(--pd-frame);
}
.wfrp-paperdoll .pd-hero-portrait {
  flex: 0 0 56px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--pd-gold-soft);
  box-shadow: 0 0 0 2px #2a2016, 0 0 12px rgba(201, 164, 92, 0.35);
  cursor: pointer;
}
.wfrp-paperdoll .pd-hero-portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  border: none;
}
.wfrp-paperdoll .pd-hero-text { min-width: 0; text-align: center; flex: 1; }
.wfrp-paperdoll .pd-hero-name {
  font-size: 19px;
  font-weight: 700;
  color: var(--pd-text);
  text-shadow: 0 1px 2px #000;
}
.wfrp-paperdoll .pd-hero-sub {
  font-size: 13px;
  color: var(--pd-gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Куколка ---------- */

.wfrp-paperdoll .pd-doll {
  flex: 1;
  display: grid;
  grid-template-columns: 82px 1fr 82px;
  grid-template-rows: 1fr auto;
  grid-template-areas:
    "left center right"
    "left weapons right";
  gap: 8px 10px;
  padding: 12px;
  min-height: 0;
  overflow: auto;
}

.wfrp-paperdoll .pd-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.wfrp-paperdoll .pd-group--left { grid-area: left; }
.wfrp-paperdoll .pd-group--right { grid-area: right; }
.wfrp-paperdoll .pd-group--weapons {
  grid-area: weapons;
  flex-direction: row;
  justify-content: center;
  gap: 18px;
}

/* ---------- Слот: квадрат + стрелочка ---------- */

.wfrp-paperdoll .pd-slot {
  display: flex;
  align-items: center;
  gap: 4px;
}

.wfrp-paperdoll .pd-slot-frame {
  position: relative;
  flex: 0 0 56px;
  width: 56px;
  height: 56px;
  padding: 3px;
  border-radius: 5px;
  background: linear-gradient(145deg, #2b2620, #0c0a08);
  border: 1px solid var(--pd-frame);
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
}

.wfrp-paperdoll .pd-slot-placeholder {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  border-radius: 3px;
  background: radial-gradient(circle, #1c1814 0%, #0b0907 80%);
  color: #3d352b;
  font-size: 22px;
}

/* AP и количество слоёв поверх иконки */
.wfrp-paperdoll .pd-ap,
.wfrp-paperdoll .pd-layers {
  position: absolute;
  z-index: 2;
  min-width: 18px;
  padding: 0 4px;
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  border-radius: 8px;
  pointer-events: auto;
}
.wfrp-paperdoll .pd-ap {
  right: -6px;
  bottom: -6px;
  color: #fff;
  background: #2c2620;
  border: 1px solid var(--pd-gold-soft);
}
.wfrp-paperdoll .pd-layers {
  right: -6px;
  top: -6px;
  color: #1a140e;
  background: var(--pd-gold-soft);
}

/* Подсветка при перетаскивании */
.wfrp-paperdoll .pd-slot.is-valid .pd-slot-frame {
  border-color: var(--pd-gold);
  box-shadow: 0 0 12px rgba(255, 209, 0, 0.5), inset 0 0 8px rgba(0, 0, 0, 0.9);
}
.wfrp-paperdoll .pd-slot.is-invalid .pd-slot-frame { opacity: 0.4; }

/* ---------- Иконка предмета + свечение редкости ---------- */

.wfrp-paperdoll .pd-item {
  --glow: var(--rarity-none);
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 3px;
  background: #0b0907;
  cursor: grab;
  border: 1px solid var(--glow);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.8),
    0 0 6px -1px var(--glow),
    inset 0 0 8px -2px var(--glow);
  transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
}
.wfrp-paperdoll .pd-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
  border-radius: 2px;
  pointer-events: none;
}
.wfrp-paperdoll .pd-item:hover {
  filter: brightness(1.2);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.8),
    0 0 14px 1px var(--glow),
    inset 0 0 12px -2px var(--glow);
}

.wfrp-paperdoll .pd-item.rarity-none { --glow: var(--rarity-none); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8); }
.wfrp-paperdoll .pd-item.rarity-common { --glow: var(--rarity-common); }
.wfrp-paperdoll .pd-item.rarity-scarce { --glow: var(--rarity-scarce); }
.wfrp-paperdoll .pd-item.rarity-rare { --glow: var(--rarity-rare); }
.wfrp-paperdoll .pd-item.rarity-exotic {
  --glow: var(--rarity-exotic);
  animation: pd-epic-pulse 2.6s ease-in-out infinite;
}
@keyframes pd-epic-pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8), 0 0 6px -1px var(--glow), inset 0 0 8px -2px var(--glow); }
  50% { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8), 0 0 13px 1px var(--glow), inset 0 0 12px -1px var(--glow); }
}

.wfrp-paperdoll .pd-item.is-dragging { opacity: 0.35; }
.wfrp-paperdoll .pd-item.is-ghost {
  opacity: 0.35;
  filter: grayscale(0.9);
  cursor: default;
  animation: none;
}
.wfrp-paperdoll .pd-item.is-plain { cursor: default; }
.wfrp-paperdoll .is-readonly .pd-item { cursor: default; }

.wfrp-paperdoll .pd-qty {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 2px #000;
}

/* ---------- Быстрая смена: стрелочка ---------- */

.wfrp-paperdoll .pd-swap {
  flex: 0 0 18px;
  width: 18px;
  min-width: 18px;
  height: 40px;
  min-height: 0;
  margin: 0;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  line-height: 1;
  color: var(--pd-gold);
  background: linear-gradient(90deg, #2a221a, #3a2f22);
  border: 1px solid var(--pd-frame-hi);
  border-radius: 3px;
  box-shadow: none;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 0.12s, transform 0.12s, background 0.12s;
}
.wfrp-paperdoll .pd-swap i { margin: 0; }
.wfrp-paperdoll .pd-slot:hover .pd-swap,
.wfrp-paperdoll .pd-swap:focus-visible,
.wfrp-paperdoll .pd-swap.is-open {
  opacity: 1;
  transform: none;
}
.wfrp-paperdoll .pd-swap:hover,
.wfrp-paperdoll .pd-swap.is-open {
  color: #1a140e;
  background: var(--pd-gold);
  border-color: var(--pd-gold);
}
@media (hover: none) {
  .wfrp-paperdoll .pd-swap { opacity: 0.8; transform: none; }
}

/* ---------- Центр: «модель» и панели статов ---------- */

.wfrp-paperdoll .pd-center {
  grid-area: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  min-height: 0;
}

.wfrp-paperdoll .pd-model {
  position: relative;
  flex: 1;
  min-height: 200px;
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  background: #0b0907;
  border: 1px solid var(--pd-frame);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
}
.wfrp-paperdoll .pd-model img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  border: none;
  opacity: 0.92;
}
.wfrp-paperdoll .pd-model::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
  pointer-events: none;
}

/* Нагрузка - тонкая полоска внизу модели */
.wfrp-paperdoll .pd-enc {
  position: absolute;
  z-index: 1;
  left: 8px;
  right: 8px;
  bottom: 8px;
  height: 18px;
  border: 1px solid var(--pd-frame);
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.75);
  overflow: hidden;
}
.wfrp-paperdoll .pd-enc-fill {
  height: 100%;
  background: linear-gradient(180deg, #8a7040, #4f3f22);
}
.wfrp-paperdoll .pd-enc.is-over .pd-enc-fill { background: linear-gradient(180deg, #d08a1f, #7a4a0e); }
.wfrp-paperdoll .pd-enc.is-max .pd-enc-fill { background: linear-gradient(180deg, #c0392b, #6e1810); }
.wfrp-paperdoll .pd-enc span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: #fff;
  text-shadow: 0 1px 2px #000;
}

.wfrp-paperdoll .pd-statboxes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.wfrp-paperdoll .pd-statbox {
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid var(--pd-frame);
  border-radius: 4px;
  overflow: hidden;
}

/* Выпадашка как в WoW: тёмная плашка и жёлтая кнопка-стрелка */
.wfrp-paperdoll .pd-select {
  position: relative;
  display: block;
  margin: 4px;
  border: 1px solid var(--pd-frame-hi);
  border-radius: 3px;
  background: linear-gradient(180deg, #2a2620, #141210);
}
.wfrp-paperdoll .pd-select select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 24px;
  margin: 0;
  padding: 0 30px 0 8px;
  font-size: 13px;
  color: var(--pd-text);
  background: transparent;
  border: none;
  outline: none;
  box-shadow: none;
  cursor: pointer;
}
.wfrp-paperdoll .pd-select select option { background: #1a1612; color: var(--pd-text); }
.wfrp-paperdoll .pd-select i {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 20px;
  height: 18px;
  display: grid;
  place-items: center;
  font-size: 12px;
  color: #3a2a00;
  background: linear-gradient(180deg, #ffe066, #c99a00);
  border-radius: 2px;
  pointer-events: none;
}

.wfrp-paperdoll .pd-statlist { padding: 2px 8px 6px; }
.wfrp-paperdoll .pd-stat {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-size: 13px;
  line-height: 19px;
}
.wfrp-paperdoll .pd-stat-label {
  color: var(--pd-gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll .pd-stat-value { color: var(--pd-text); font-variant-numeric: tabular-nums; white-space: nowrap; }


/* ---------- Правая панель: вкладки ---------- */

.wfrp-paperdoll .pd-side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-left: 1px solid var(--pd-frame);
  background: rgba(0, 0, 0, 0.35);
  transition: box-shadow 0.15s;
}
.wfrp-paperdoll .pd-side.is-valid { box-shadow: inset 0 0 18px rgba(255, 209, 0, 0.3); }

.wfrp-paperdoll .pd-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 8px 0;
  border-bottom: 1px solid var(--pd-frame);
}
.wfrp-paperdoll .pd-tab {
  flex: 1;
  height: 28px;
  margin: 0;
  padding: 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--pd-text-dim);
  background: linear-gradient(180deg, #221c16, #15110d);
  border: 1px solid var(--pd-frame);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  box-shadow: none;
  cursor: pointer;
}
.wfrp-paperdoll .pd-tab:hover { color: var(--pd-text); }
.wfrp-paperdoll .pd-tab.is-active {
  color: #fff;
  background: linear-gradient(180deg, #8b1a12, #4a0d08);
  border-color: #b8322a;
}

.wfrp-paperdoll .pd-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px;
}
.wfrp-paperdoll .pd-filter {
  flex: 0 0 auto;
  width: auto;
  height: auto;
  margin: 0;
  padding: 2px 8px;
  font-size: 11px;
  line-height: 18px;
  color: var(--pd-text-dim);
  background: #1a1612;
  border: 1px solid var(--pd-frame);
  border-radius: 10px;
  box-shadow: none;
  cursor: pointer;
}
.wfrp-paperdoll .pd-filter:hover { color: var(--pd-text); }
.wfrp-paperdoll .pd-filter.is-active { color: #1a140e; background: var(--pd-gold); border-color: var(--pd-gold); }
.wfrp-paperdoll .pd-filter-count { opacity: 0.7; }

.wfrp-paperdoll .pd-bag-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, 46px);
  grid-auto-rows: 46px;
  gap: 8px;
  align-content: start;
  padding: 6px 10px 10px;
  overflow-y: auto;
}
.wfrp-paperdoll .pd-bag-empty {
  grid-column: 1 / -1;
  padding: 20px 0;
  text-align: center;
  color: var(--pd-text-dim);
  font-style: italic;
}
.wfrp-paperdoll .pd-bag-hint {
  padding: 6px 10px 8px;
  font-size: 11px;
  color: var(--pd-text-dim);
  border-top: 1px solid var(--pd-frame);
}

/* ---------- Вкладка «Характеристики» (как аддон ECS) ---------- */

.wfrp-paperdoll .pd-ecs {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px 12px;
}
.wfrp-paperdoll .pd-ecs-cat + .pd-ecs-cat { margin-top: 10px; }
.wfrp-paperdoll .pd-ecs-head {
  font-size: 15px;
  font-weight: 700;
  color: var(--pd-gold);
  text-shadow: 0 1px 2px #000;
  margin-bottom: 2px;
}
.wfrp-paperdoll .pd-ecs-row {
  padding-left: 12px;
  font-size: 13px;
  line-height: 19px;
  color: #c8bca4;
}
.wfrp-paperdoll .pd-ecs-value { color: var(--pd-text); font-variant-numeric: tabular-nums; }

/* Цвета значений (общие для панелей и вкладки статов) */
.wfrp-paperdoll span.is-up { color: var(--pd-up); }
.wfrp-paperdoll span.is-down { color: var(--pd-down); }
.wfrp-paperdoll span.is-fate { color: var(--pd-fate); }
.wfrp-paperdoll span.is-chaos { color: var(--pd-chaos); }
.wfrp-paperdoll span.is-sin { color: var(--pd-down); }
.wfrp-paperdoll span.is-melee { color: var(--pd-melee); }
.wfrp-paperdoll span.is-armour { color: #ffffff; }

/* Кнопка в шапке листа персонажа */
.wfrp-paperdoll-open { color: inherit; }

/* ==========================================================
   Тултип (висит в body)
   ========================================================== */

.wfrp-paperdoll-tooltip {
  position: fixed;
  z-index: 10000;
  display: none;
  max-width: 300px;
  padding: 8px 10px;
  font-size: 13px;
  line-height: 1.35;
  color: #f0e6d2;
  background: rgba(8, 8, 18, 0.95);
  border: 1px solid #a0a0b4;
  border-radius: 5px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
  pointer-events: none;
}
.wfrp-paperdoll-tooltip.is-visible { display: block; }

.wfrp-paperdoll-tooltip .pd-tt-name { font-size: 15px; font-weight: 700; color: var(--rarity-none); }
.wfrp-paperdoll-tooltip .rarity-common { color: var(--rarity-common); }
.wfrp-paperdoll-tooltip .rarity-scarce { color: var(--rarity-scarce); }
.wfrp-paperdoll-tooltip .rarity-rare { color: #3a8dff; }
.wfrp-paperdoll-tooltip .rarity-exotic { color: #b45cff; }

.wfrp-paperdoll-tooltip .pd-tt-sub { color: #a89c86; font-size: 12px; margin-bottom: 4px; }
.wfrp-paperdoll-tooltip .pd-tt-row { display: flex; justify-content: space-between; gap: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-stat { color: #fff; }
.wfrp-paperdoll-tooltip .pd-tt-quality { color: #1eff00; margin-top: 4px; }
.wfrp-paperdoll-tooltip .pd-tt-flaw { color: #ff4f4f; margin-top: 2px; }
.wfrp-paperdoll-tooltip .pd-tt-desc { color: #ffd100; margin-top: 6px; font-style: italic; }
.wfrp-paperdoll-tooltip .pd-tt-footer { color: #a89c86; margin-top: 6px; font-size: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-avail { font-size: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-hint { margin-top: 6px; font-size: 11px; color: #6f6a80; }

/* ==========================================================
   Быстрая смена: выпадающий список (висит в body)
   ========================================================== */

.wfrp-paperdoll-flyout {
  position: fixed;
  z-index: 9999;
  width: 280px;
  max-height: 380px;
  overflow-y: auto;
  padding: 6px;
  color: #f0e6d2;
  background: rgba(14, 12, 10, 0.97);
  border: 1px solid #c9a45c;
  border-radius: 5px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
  font-size: 13px;
  animation: pd-fly-in 0.12s ease-out;
}
@keyframes pd-fly-in {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: none; }
}
.wfrp-paperdoll-flyout .pd-fly-title {
  padding: 2px 6px 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pd-gold);
  border-bottom: 1px solid #4a4339;
}
.wfrp-paperdoll-flyout .pd-fly-section {
  padding: 8px 6px 4px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #8a7a5e;
}
.wfrp-paperdoll-flyout .pd-fly-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 4px;
  cursor: pointer;
}
.wfrp-paperdoll-flyout .pd-fly-row:hover { background: rgba(255, 209, 0, 0.1); }
.wfrp-paperdoll-flyout .pd-fly-icon {
  --glow: var(--rarity-none);
  position: relative;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border: 1px solid var(--glow);
  border-radius: 3px;
  background: #0b0907;
  box-shadow: 0 0 6px -1px var(--glow), inset 0 0 6px -2px var(--glow);
}
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-none { box-shadow: none; }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-common { --glow: var(--rarity-common); }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-scarce { --glow: var(--rarity-scarce); }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-rare { --glow: var(--rarity-rare); }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-exotic { --glow: var(--rarity-exotic); }
.wfrp-paperdoll-flyout .pd-fly-icon img { width: 100%; height: 100%; object-fit: cover; border: none; }
.wfrp-paperdoll-flyout .pd-fly-icon .pd-qty {
  position: absolute;
  right: 1px;
  bottom: -1px;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 0 2px #000, 0 0 2px #000;
}
.wfrp-paperdoll-flyout .pd-fly-text { flex: 1; min-width: 0; }
.wfrp-paperdoll-flyout .pd-fly-name {
  font-weight: 700;
  color: var(--rarity-none);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll-flyout .pd-fly-name.rarity-common { color: var(--rarity-common); }
.wfrp-paperdoll-flyout .pd-fly-name.rarity-scarce { color: var(--rarity-scarce); }
.wfrp-paperdoll-flyout .pd-fly-name.rarity-rare { color: #3a8dff; }
.wfrp-paperdoll-flyout .pd-fly-name.rarity-exotic { color: #b45cff; }
.wfrp-paperdoll-flyout .pd-fly-meta {
  font-size: 11px;
  color: #a89c86;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll-flyout .pd-fly-act { color: #a89c86; font-size: 13px; padding: 4px; }
.wfrp-paperdoll-flyout .pd-fly-row:hover .pd-fly-act { color: #ff6b5b; }
.wfrp-paperdoll-flyout .pd-fly-empty { padding: 8px 6px; font-style: italic; color: #8a7a5e; }

</style>

window.__PD_TEMPLATES__ = {"modules/wfrp4e-paperdoll/templates/paperdoll.hbs":"\u003cdiv class=\"pd-root {{#unless editable}}is-readonly{{/unless}}\">\n\n  \u003csection class=\"pd-main\">\n\n    \u003cheader class=\"pd-hero\">\n      \u003cdiv class=\"pd-hero-portrait\" data-action=\"openSheet\" title=\"{{name}}\">\n        \u003cimg src=\"{{img}}\" alt=\"{{name}}\">\n      \u003c/div>\n      \u003cdiv class=\"pd-hero-text\">\n        \u003cdiv class=\"pd-hero-name\">{{name}}\u003c/div>\n        {{#if subtitle}}\u003cdiv class=\"pd-hero-sub\">{{subtitle}}\u003c/div>{{/if}}\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv class=\"pd-doll\">\n      {{#each groups}}\n      \u003cdiv class=\"pd-group pd-group--{{area}}\">\n        {{#each slots}}\n        \u003cdiv class=\"pd-slot {{#unless top}}is-empty{{/unless}}\" data-slot=\"{{key}}\">\n          \u003cdiv class=\"pd-slot-frame\">\n            {{#if top}}\n            \u003cdiv class=\"pd-item rarity-{{top.rarity}} {{#if top.ghost}}is-ghost{{/if}}\" data-item-id=\"{{top.id}}\"\n                 draggable=\"{{#if top.draggable}}true{{else}}false{{/if}}\">\n              \u003cimg src=\"{{top.img}}\" alt=\"{{top.name}}\">\n              {{#if top.qty}}\u003cspan class=\"pd-qty\">{{top.qty}}\u003c/span>{{/if}}\n            \u003c/div>\n            {{else}}\n            \u003cdiv class=\"pd-slot-placeholder\" title=\"{{label}}\">\u003ci class=\"{{icon}}\">\u003c/i>\u003c/div>\n            {{/if}}\n            {{#if layers}}\u003cspan class=\"pd-layers\" title=\"{{label}}\">+{{layers}}\u003c/span>{{/if}}\n            {{#if showAP}}\u003cspan class=\"pd-ap\" title=\"AP: {{label}}\">{{ap}}\u003c/span>{{/if}}\n          \u003c/div>\n          {{#if @root.editable}}\n          \u003cbutton type=\"button\" class=\"pd-swap\" data-slot=\"{{key}}\" title=\"{{localize \"WFRPPD.Swap\"}}: {{label}}\">\n            \u003ci class=\"fa-solid fa-chevron-right\">\u003c/i>\n          \u003c/button>\n          {{/if}}\n        \u003c/div>\n        {{/each}}\n      \u003c/div>\n      {{/each}}\n\n      \u003cdiv class=\"pd-center\">\n        \u003cdiv class=\"pd-model\" data-action=\"openSheet\">\n          \u003cimg src=\"{{img}}\" alt=\"{{name}}\">\n          \u003cdiv class=\"pd-enc is-{{encumbrance.state}}\" title=\"{{localize \"WFRPPD.Encumbrance\"}}\">\n            \u003cdiv class=\"pd-enc-fill\" style=\"width: {{encumbrance.pct}}%\">\u003c/div>\n            \u003cspan>{{localize \"WFRPPD.Encumbrance\"}}: {{encumbrance.current}} / {{encumbrance.max}} · {{encumbrance.stateLabel}}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"pd-statboxes\">\n          {{#each statPanels}}\n          \u003cdiv class=\"pd-statbox\">\n            \u003clabel class=\"pd-select\">\n              \u003cselect data-panel=\"{{@index}}\">\n                {{#each options}}\u003coption value=\"{{key}}\" {{#if selected}}selected{{/if}}>{{label}}\u003c/option>{{/each}}\n              \u003c/select>\n              \u003ci class=\"fa-solid fa-caret-down\">\u003c/i>\n            \u003c/label>\n            \u003cdiv class=\"pd-statlist\">\n              {{#each rows}}\n              \u003cdiv class=\"pd-stat\" {{#if hint}}title=\"{{hint}}\"{{/if}}>\n                \u003cspan class=\"pd-stat-label\">{{label}}:\u003c/span>\n                \u003cspan class=\"pd-stat-value {{cls}}\">{{value}}\u003c/span>\n              \u003c/div>\n              {{/each}}\n            \u003c/div>\n          \u003c/div>\n          {{/each}}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"pd-side pd-bag\">\n    \u003cnav class=\"pd-tabs\">\n      \u003cbutton type=\"button\" class=\"pd-tab {{#if tabBag}}is-active{{/if}}\" data-action=\"setTab\" data-tab=\"bag\">\n        \u003ci class=\"fa-solid fa-sack\">\u003c/i> {{localize \"WFRPPD.Bag\"}}\n      \u003c/button>\n      \u003cbutton type=\"button\" class=\"pd-tab {{#if tabStats}}is-active{{/if}}\" data-action=\"setTab\" data-tab=\"stats\">\n        \u003ci class=\"fa-solid fa-chart-simple\">\u003c/i> {{localize \"WFRPPD.StatsTab\"}}\n      \u003c/button>\n    \u003c/nav>\n\n    {{#if tabBag}}\n    \u003cdiv class=\"pd-filters\">\n      {{#each filters}}\n      \u003cbutton type=\"button\" class=\"pd-filter {{#if active}}is-active{{/if}}\" data-action=\"setFilter\" data-filter=\"{{key}}\">\n        {{label}} \u003cspan class=\"pd-filter-count\">{{count}}\u003c/span>\n      \u003c/button>\n      {{/each}}\n    \u003c/div>\n\n    \u003cdiv class=\"pd-bag-grid\">\n      {{#each bag}}\n      \u003cdiv class=\"pd-item rarity-{{rarity}} {{#unless equippable}}is-plain{{/unless}}\" data-item-id=\"{{id}}\"\n           draggable=\"{{#if draggable}}true{{else}}false{{/if}}\">\n        \u003cimg src=\"{{img}}\" alt=\"{{name}}\">\n        {{#if qty}}\u003cspan class=\"pd-qty\">{{qty}}\u003c/span>{{/if}}\n      \u003c/div>\n      {{/each}}\n      {{#if bagEmpty}}\u003cdiv class=\"pd-bag-empty\">{{localize \"WFRPPD.BagEmpty\"}}\u003c/div>{{/if}}\n    \u003c/div>\n\n    \u003cfooter class=\"pd-bag-hint\">{{localize \"WFRPPD.Hint\"}}\u003c/footer>\n    {{else}}\n    \u003cdiv class=\"pd-ecs\">\n      {{#each statCategories}}\n      \u003cdiv class=\"pd-ecs-cat pd-ecs-cat--{{key}}\">\n        \u003cdiv class=\"pd-ecs-head\">{{label}}\u003c/div>\n        {{#each rows}}\n        \u003cdiv class=\"pd-ecs-row\" {{#if hint}}title=\"{{hint}}\"{{/if}}>\n          \u003cspan class=\"pd-ecs-label\">{{label}}:\u003c/span>\n          \u003cspan class=\"pd-ecs-value {{cls}}\">{{value}}\u003c/span>\n        \u003c/div>\n        {{/each}}\n      \u003c/div>\n      {{/each}}\n    \u003c/div>\n    {{/if}}\n  \u003c/section>\n\n\u003c/div>\n"};
</script>
<script>/* ==========================================================
   Мини-«Foundry» для мока в браузере.
   Ровно столько API, сколько нужно настоящему коду модуля
   (scripts/paperdoll-app.js), чтобы он работал без Foundry.
   ========================================================== */
(() => {
  const LANG = window.__PD_LANG__;
  const SYS = window.__PD_SYSTEM_STRINGS__;

  const lookup = (key) => key.split(".").reduce((o, p) => (o == null ? undefined : o[p]), LANG);
  const i18n = {
    lang: "ru",
    has: (k) => typeof lookup(k) === "string" || k in SYS,
    localize: (k) => {
      const v = lookup(k);
      if (typeof v === "string") return v;
      return SYS[k] ?? k;
    },
    format: (k, data = {}) => i18n.localize(k).replace(/\{(\w+)\}/g, (_, x) => data[x] ?? "")
  };

  // --- Уведомления ---
  const toast = (msg, kind = "warn") => {
    const t = document.createElement("div");
    t.className = `mock-toast mock-toast--${kind}`;
    t.textContent = msg;
    document.body.append(t);
    setTimeout(() => t.remove(), 2400);
  };
  window.ui = { notifications: { warn: (m) => toast(m), error: (m) => toast(m), info: (m) => toast(m, "info") } };

  // --- Hooks ---
  const hooks = new Map();
  let hookId = 0;
  window.Hooks = {
    on(name, fn) {
      const id = ++hookId;
      if (!hooks.has(name)) hooks.set(name, new Map());
      hooks.get(name).set(id, fn);
      return id;
    },
    once(name, fn) {
      const id = this.on(name, (...a) => {
        this.off(name, id);
        fn(...a);
      });
      return id;
    },
    off(name, id) {
      hooks.get(name)?.delete(id);
    },
    call(name, ...args) {
      for (const fn of [...(hooks.get(name)?.values() ?? [])]) fn(...args);
    }
  };

  if (!Math.clamp) Math.clamp = (v, min, max) => Math.min(Math.max(v, min), max);

  // --- Handlebars ---
  Handlebars.registerHelper("localize", (k) => i18n.localize(k));
  const templates = {};
  for (const [path, src] of Object.entries(window.__PD_TEMPLATES__)) templates[path] = Handlebars.compile(src);

  // --- ApplicationV2 (минимум) ---
  class ApplicationV2 {
    constructor(options = {}) {
      const chain = [];
      let c = this.constructor;
      while (c && c !== Object && c !== Function.prototype) {
        if (Object.hasOwn(c, "DEFAULT_OPTIONS")) chain.unshift(c.DEFAULT_OPTIONS);
        c = Object.getPrototypeOf(c);
      }
      const merged = { actions: {}, window: {}, position: {}, classes: [] };
      for (const o of [...chain, options]) {
        Object.assign(merged.actions, o.actions ?? {});
        Object.assign(merged.window, o.window ?? {});
        Object.assign(merged.position, o.position ?? {});
        merged.classes.push(...(o.classes ?? []));
        if (o.id) merged.id = o.id;
      }
      this.options = merged;
      this.element = null;
      this.rendered = false;
    }

    get title() {
      return "";
    }

    async render() {
      const ctx = await this._prepareContext({});
      if (!this.element) this._buildFrame();
      const content = this.element.querySelector(".window-content");
      const scrollSel = Object.values(this.constructor.PARTS ?? {}).flatMap((p) => p.scrollable ?? []);
      const scroll = scrollSel.map((s) => [s, content.querySelector(s)?.scrollTop ?? 0]);
      const part = Object.values(this.constructor.PARTS)[0];
      content.innerHTML = templates[part.template](ctx);
      for (const [s, top] of scroll) {
        const el = content.querySelector(s);
        if (el) el.scrollTop = top;
      }
      this.element.querySelector(".window-title").textContent = this.title;
      this.rendered = true;
      await this._onRender(ctx, {});
      return this;
    }

    _buildFrame() {
      const el = document.createElement("div");
      el.className = ["app", "window-app", ...this.options.classes].join(" ");
      if (this.options.id) el.id = this.options.id;
      el.style.width = `${this.options.position.width}px`;
      el.style.height = `${this.options.position.height}px`;
      el.innerHTML = `
        <header class="window-header">
          <i class="window-icon ${this.options.window.icon ?? ""}"></i>
          <span class="window-title"></span>
          <button type="button" class="header-control" data-mock-close title="Закрыть"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <section class="window-content"></section>`;
      el.querySelector("[data-mock-close]").addEventListener("click", () => this.close());
      el.addEventListener("click", (ev) => {
        const target = ev.target.closest("[data-action]");
        if (!target || !el.contains(target)) return;
        const handler = this.options.actions[target.dataset.action];
        if (handler) handler.call(this, ev, target);
      });
      document.getElementById("mock-mount").append(el);
      this.element = el;
    }

    bringToFront() {}

    async close() {
      await this._onClose({});
      this.element?.remove();
      this.element = null;
      this.rendered = false;
      document.getElementById("mock-reopen").hidden = false;
    }

    async _prepareContext() {
      return {};
    }
    async _onRender() {}
    async _onClose() {}
  }

  const debounce = (fn, ms) => {
    let t;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };

  window.foundry = {
    applications: {
      api: { ApplicationV2, HandlebarsApplicationMixin: (Base) => class extends Base {} },
      ux: {
        TextEditor: {
          implementation: {
            getDragEventData(ev) {
              try {
                return JSON.parse(ev.dataTransfer.getData("text/plain"));
              } catch (e) {
                return {};
              }
            }
          }
        }
      }
    },
    utils: { debounce }
  };

  /* ---------- Фейковые документы ---------- */

  const setPath = (obj, path, value) => {
    const parts = path.split(".");
    let o = obj;
    for (const p of parts.slice(0, -1)) o = o[p] ??= {};
    o[parts.at(-1)] = value;
  };
  const flatten = (obj, prefix = "", out = {}) => {
    for (const [k, v] of Object.entries(obj)) {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, key, out);
      else out[key] = v;
    }
    return out;
  };

  const LOCS = ["head", "body", "rArm", "lArm", "rLeg", "lLeg"];

  function makeSystem(item, data) {
    const sys = structuredClone(data);
    const type = item.type;
    const getters = {
      isPhysical: { get: () => true },
      isEquippable: { get: () => ["armour", "weapon", "trapping", "container"].includes(type) },
      isEquipped: { get: () => !!sys.equipped?.value },
      canEquip: { get: () => type !== "trapping" || sys.trappingType?.value === "clothingAccessories" },
      Qualities: { get: () => sys._qualities ?? [] },
      Flaws: { get: () => sys._flaws ?? [] },
      properties: {
        get: () => ({ qualities: Object.fromEntries((sys._qualities ?? []).map((q) => [q.split(" ")[0].toLowerCase() === "щит" ? "shield" : q, true])) })
      }
    };
    if (type === "armour") {
      getters.protects = { get: () => Object.fromEntries(LOCS.map((l) => [l, (sys.AP?.[l] ?? 0) > 0])) };
      getters.currentAP = { get: () => sys.AP };
    }
    if (type === "weapon") {
      getters.isMelee = { get: () => !sys._ranged };
      getters.isRanged = { get: () => !!sys._ranged };
      getters.WeaponGroup = { get: () => `WFRP4E.GroupType.${sys.weaponGroup?.value}` };
      getters.Reach = { get: () => (sys._ranged ? null : `WFRP4E.Reach.${sys.reach?.value}`) };
      getters.Range = { get: () => sys._range ?? null };
      getters.Damage = {
        get: () => {
          const sb = item.parent.system.characteristics.s.bonus;
          const f = String(sys.damage?.value || "0").replace("SB", sb);
          return f.split("+").reduce((a, b) => a + Number(b || 0), 0);
        }
      };
    }
    Object.defineProperties(sys, getters);
    return sys;
  }

  class FakeItem {
    constructor(actor, data) {
      this.parent = actor;
      this.id = data.id;
      this.uuid = `Actor.${actor.id}.Item.${data.id}`;
      this.name = data.name;
      this.img = data.img;
      this.type = data.type;
      this.system = makeSystem(this, data.system ?? {});
    }
    get actor() {
      return this.parent;
    }
    get sheet() {
      return { render: () => toast(`ПКМ: в Foundry тут откроется лист «${this.name}»`, "info") };
    }
    toDragData() {
      return { type: "Item", uuid: this.uuid };
    }
    async update(changes, { silent = false } = {}) {
      const flat = flatten(changes);
      // Как в системе: смена «надето» у оружия сбрасывает вторую руку
      if (this.type === "weapon" && "system.equipped.value" in flat && !("system.offhand.value" in flat))
        flat["system.offhand.value"] = false;
      for (const [k, v] of Object.entries(flat)) setPath(this, k, v);
      this.parent.prepare();
      if (!silent) Hooks.call("updateItem", this, changes);
      return this;
    }
  }

  class FakeActor {
    constructor(data) {
      this.id = data.id;
      this.uuid = `Actor.${data.id}`;
      this.name = data.name;
      this.img = data.img;
      this.type = "character";
      this.isOwner = true;
      this.system = structuredClone(data.system);
      const arr = data.items.map((d) => new FakeItem(this, d));
      arr.get = (id) => arr.find((i) => i.id === id);
      this.items = arr;
      this.career = data.career;
      const actor = this;
      Object.defineProperties(this.system, {
        currentCareer: { get: () => ({ name: actor.career.name, system: { level: { value: actor.career.level } } }) },
        equipPointsUsed: {
          get: () => actor.items.filter((i) => i.type === "weapon" && i.system.isEquipped).reduce((n, w) => n + (w.system.twohanded?.value ? 2 : 1), 0)
        }
      });
      this.prepare();
    }
    get itemTypes() {
      const out = {};
      for (const i of this.items) (out[i.type] ??= []).push(i);
      return out;
    }
    get sheet() {
      return { render: () => toast("В Foundry тут откроется лист персонажа", "info") };
    }
    async updateEmbeddedDocuments(type, updates) {
      for (const u of updates) {
        const { _id, ...rest } = u;
        await this.items.get(_id)?.update(rest, { silent: true });
      }
      Hooks.call("updateActor", this, {});
    }
    /** Пересчёт как в системе: AP по локациям и нагрузка */
    prepare() {
      const s = this.system;
      for (const c of Object.values(s.characteristics)) {
        if (c.initial !== undefined) c.value = c.initial + (c.modifier || 0) + (c.advances || 0);
        c.bonus ??= Math.floor(c.value / 10);
        if (c.initial !== undefined) c.bonus = Math.floor(c.value / 10);
      }
      s.status.armour = {};
      for (const l of LOCS) s.status.armour[l] = { value: 0 };
      let enc = 0;
      for (const i of this.items) {
        const sys = i.system;
        let e = (sys.encumbrance?.value ?? 0) * (sys.quantity?.value ?? 1);
        if (sys.isEquipped && ["armour", "trapping"].includes(i.type)) e = Math.max(0, e - 1);
        sys.encumbrance.total = e;
        enc += e;
        if (i.type === "armour" && sys.isEquipped) for (const l of LOCS) s.status.armour[l].value += sys.AP?.[l] ?? 0;
      }
      s.status.encumbrance.current = Math.round(enc * 100) / 100;
      s.status.encumbrance.max = s.characteristics.s.bonus + s.characteristics.t.bonus;
    }
  }

  window.__PD_makeActor__ = (data) => {
    const actor = new FakeActor(data);
    window.fromUuid = async (uuid) => actor.items.find((i) => i.uuid === uuid) ?? null;
    return actor;
  };

  window.game = {
    i18n,
    user: { isGM: true },
    wfrp4e: { config: window.__PD_CONFIG__ }
  };
  game.modules = new Map([["wfrp4e-paperdoll", {}]]);
})();
</script>
<script type="module">
const src = "export const MODULE_ID = \"wfrp4e-paperdoll\";\n\nconst { ApplicationV2, HandlebarsApplicationMixin } = foundry.applications.api;\n\n/** Локации брони в WFRP4e (ключи как в system.AP и actor.system.status.armour) */\nconst LOCATIONS = [\"head\", \"body\", \"rArm\", \"lArm\", \"rLeg\", \"lLeg\"];\n\n/** Иконки пустых слотов (Font Awesome 6 free) */\nconst SLOT_ICONS = {\n  head: \"fa-solid fa-user\",\n  body: \"fa-solid fa-shirt\",\n  rArm: \"fa-solid fa-hand\",\n  lArm: \"fa-solid fa-hand\",\n  rLeg: \"fa-solid fa-socks\",\n  lLeg: \"fa-solid fa-socks\",\n  accessory: \"fa-solid fa-ring\",\n  container: \"fa-solid fa-sack-xmark\",\n  main: \"fa-solid fa-hand-fist\",\n  off: \"fa-solid fa-shield-halved\"\n};\n\n/** Доступность предмета -> «редкость» рамки в стиле WoW */\nconst RARITY = {\n  common: \"common\",\n  scarce: \"scarce\",\n  rare: \"rare\",\n  exotic: \"exotic\",\n  special: \"exotic\"\n};\n\nconst BAG_FILTERS = [\"all\", \"weapon\", \"armour\", \"clothing\", \"other\"];\n\n/** Наборы статов для выпадашек под портретом */\nconst STAT_SETS = [\"physical\", \"mental\", \"combat\", \"defence\", \"fate\"];\n\nfunction esc(value) {\n  return String(value ?? \"\")\n    .replaceAll(\"&\", \"&amp;\")\n    .replaceAll(\"\u003c\", \"&lt;\")\n    .replaceAll(\">\", \"&gt;\")\n    .replaceAll('\"', \"&quot;\");\n}\n\nfunction stripHTML(html) {\n  const div = document.createElement(\"div\");\n  div.innerHTML = html ?? \"\";\n  return (div.textContent ?? \"\").replace(/\\s+/g, \" \").trim();\n}\n\nfunction safe(fn, fallback = null) {\n  try {\n    return fn();\n  } catch (e) {\n    return fallback;\n  }\n}\n\nexport class PaperdollApp extends HandlebarsApplicationMixin(ApplicationV2) {\n  /** Одно окно на актёра */\n  static instances = new Map();\n\n  static uiState = { filter: \"all\", tab: \"bag\", statPanels: [\"physical\", \"combat\"] };\n\n  _saveUiState() {\n    PaperdollApp.uiState = { filter: this._filter, tab: this._tab, statPanels: [...this._statPanels] };\n  }\n\n  static openFor(actor) {\n    if (!actor) return null;\n    let app = this.instances.get(actor.uuid);\n    if (!app) {\n      app = new this({ actor });\n      this.instances.set(actor.uuid, app);\n    }\n    app.render({ force: true });\n    if (app.rendered) app.bringToFront?.();\n    return app;\n  }\n\n  static DEFAULT_OPTIONS = {\n    classes: [\"wfrp-paperdoll\"],\n    tag: \"div\",\n    window: {\n      icon: \"fa-solid fa-user-shield\",\n      resizable: true\n    },\n    position: { width: 960, height: 720 },\n    actions: {\n      setFilter: PaperdollApp.onSetFilter,\n      setTab: PaperdollApp.onSetTab,\n      openSheet: PaperdollApp.onOpenSheet\n    }\n  };\n\n  static PARTS = {\n    main: {\n      template: `modules/${MODULE_ID}/templates/paperdoll.hbs`,\n      scrollable: [\".pd-bag-grid\"]\n    }\n  };\n\n  constructor({ actor, ...options } = {}) {\n    const safeId = actor.uuid.replace(/[^a-zA-Z0-9_-]/g, \"-\");\n    super({ ...options, id: `wfrp-paperdoll-${safeId}` });\n    this.actor = actor;\n    // Выбор вкладки и выпадашек запоминаем между открытиями окна\n    this._filter = PaperdollApp.uiState.filter;\n    this._tab = PaperdollApp.uiState.tab;\n    this._statPanels = [...PaperdollApp.uiState.statPanels];\n    this._dragging = null;\n\n    this._debouncedRender = foundry.utils.debounce(() => {\n      if (this.rendered) this.render();\n    }, 50);\n\n    const isMine = (doc) => doc?.parent?.uuid === this.actor.uuid;\n    this._hooks = [\n      [\"createItem\", Hooks.on(\"createItem\", (item) => isMine(item) && this._debouncedRender())],\n      [\"updateItem\", Hooks.on(\"updateItem\", (item) => isMine(item) && this._debouncedRender())],\n      [\"deleteItem\", Hooks.on(\"deleteItem\", (item) => isMine(item) && this._debouncedRender())],\n      [\"updateActor\", Hooks.on(\"updateActor\", (a) => a.uuid === this.actor.uuid && this._debouncedRender())],\n      [\"deleteActor\", Hooks.on(\"deleteActor\", (a) => a.uuid === this.actor.uuid && this.close())]\n    ];\n  }\n\n  get title() {\n    return `${game.i18n.localize(\"WFRPPD.Title\")}: ${this.actor.name}`;\n  }\n\n  get editable() {\n    return this.actor.isOwner;\n  }\n\n  /* -------------------------------------------- */\n  /*  Данные                                      */\n  /* -------------------------------------------- */\n\n  async _prepareContext(options) {\n    const actor = this.actor;\n    const sys = actor.system;\n    const cfg = game.wfrp4e.config;\n    const L = (key) => game.i18n.localize(key);\n    const editable = this.editable;\n\n    const view = (item, extra = {}) => this._itemView(item, editable, extra);\n    const equipped = (type) => (actor.itemTypes[type] ?? []).filter((i) => i.system.isEquipped);\n\n    /** Слот в стиле WoW: одна иконка сверху, остальные слои считаем */\n    const makeSlot = (key, items, { showAP = false, ghost = null } = {}) => {\n      const views = items.map((i) => view(i));\n      if (!views.length && ghost) views.push(view(ghost, { ghost: true }));\n      return {\n        key,\n        label: this._slotLabel(key),\n        icon: SLOT_ICONS[key],\n        top: views[0] ?? null,\n        layers: Math.max(0, views.filter((v) => !v.ghost).length - 1),\n        showAP,\n        ap: showAP ? (sys.status?.armour?.[key]?.value ?? 0) : null\n      };\n    };\n\n    // --- Броня: сверху слой с наибольшим AP на этой локации ---\n    const armour = equipped(\"armour\");\n    const armourSlot = (key) => {\n      const items = armour\n        .filter((a) => a.system.protects?.[key])\n        .sort((a, b) => (b.system.AP?.[key] ?? 0) - (a.system.AP?.[key] ?? 0));\n      return makeSlot(key, items, { showAP: true });\n    };\n\n    // --- Оружие ---\n    const weapons = equipped(\"weapon\");\n    const mainItems = weapons.filter((w) => !w.system.offhand?.value);\n    const offItems = weapons.filter((w) => w.system.offhand?.value);\n    const twoHander = mainItems.find((w) => w.system.twohanded?.value);\n\n    const clothing = equipped(\"trapping\").filter((t) => t.system.trappingType?.value === \"clothingAccessories\");\n\n    const groups = [\n      { area: \"left\", slots: [\"head\", \"body\", \"rArm\", \"lArm\"].map(armourSlot) },\n      {\n        area: \"right\",\n        slots: [armourSlot(\"rLeg\"), armourSlot(\"lLeg\"), makeSlot(\"accessory\", clothing), makeSlot(\"container\", equipped(\"container\"))]\n      },\n      {\n        area: \"weapons\",\n        slots: [makeSlot(\"main\", mainItems), makeSlot(\"off\", offItems, { ghost: twoHander })]\n      }\n    ];\n\n    // --- Сумка ---\n    const bagAll = actor.items\n      .filter((i) => i.system?.isPhysical && i.type !== \"money\" && !i.system.isEquipped)\n      .sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name, game.i18n.lang));\n    const bag = bagAll.filter((i) => this._matchesFilter(i, this._filter)).map((i) => view(i));\n    const filters = BAG_FILTERS.map((key) => ({\n      key,\n      label: L(`WFRPPD.Filter.${key}`),\n      active: key === this._filter,\n      count: bagAll.filter((i) => this._matchesFilter(i, key)).length\n    }));\n\n    // --- Статы ---\n    const sets = this._statSets(mainItems, offItems, weapons);\n    const statPanels = this._statPanels.map((selected) => ({\n      options: STAT_SETS.map((key) => ({ key, label: L(`WFRPPD.Stats.Set.${key}`), selected: key === selected })),\n      rows: sets[selected] ?? []\n    }));\n    const statCategories = this._statCategories(sets);\n\n    // --- Шапка: имя, карьера, вид ---\n    const career = safe(() => sys.currentCareer ?? actor.currentCareer);\n    const level = career?.system?.level?.value;\n    const speciesKey = sys.details?.species?.value;\n    const species = speciesKey ? L(cfg.species?.[speciesKey] ?? speciesKey) : \"\";\n    const subtitle = [\n      career ? `${career.name}${level ? ` (${L(\"WFRPPD.Level\")} ${level})` : \"\"}` : \"\",\n      species,\n      sys.details?.status?.value ?? \"\"\n    ]\n      .filter(Boolean)\n      .join(\" · \");\n\n    const enc = sys.status?.encumbrance ?? {};\n    const encCurrent = Number(enc.current) || 0;\n    const encMax = Number(enc.max) || 0;\n    const encRatio = encMax ? encCurrent / encMax : 0;\n    let encState = \"ok\";\n    if (encRatio > 2) encState = \"max\";\n    else if (encRatio > 1) encState = \"over\";\n\n    return {\n      actor,\n      editable,\n      img: actor.img,\n      name: actor.name,\n      subtitle,\n      groups,\n      bag,\n      bagEmpty: !bag.length,\n      filters,\n      statPanels,\n      statCategories,\n      tabBag: this._tab === \"bag\",\n      tabStats: this._tab === \"stats\",\n      encumbrance: {\n        current: encCurrent,\n        max: encMax,\n        pct: Math.clamp(encRatio * 100, 0, 100),\n        state: encState,\n        stateLabel: L(`WFRPPD.Enc.${encState}`)\n      }\n    };\n  }\n\n  /* -------------------------------------------- */\n  /*  Статы в стиле WoW / ECS                     */\n  /* -------------------------------------------- */\n\n  /** Все наборы строк для выпадашек под портретом */\n  _statSets(mainItems, offItems, weapons) {\n    const sys = this.actor.system;\n    const cfg = game.wfrp4e.config;\n    const L = (key) => game.i18n.localize(key);\n    const chars = sys.characteristics ?? {};\n    const st = sys.status ?? {};\n    const det = sys.details ?? {};\n\n    const charRow = (key) => {\n      const c = chars[key] ?? {};\n      const mod = Number(c.modifier) || 0;\n      const full = cfg.characteristics?.[key];\n      return {\n        label: full ? L(full) : L(cfg.characteristicsAbbrev?.[key] ?? key),\n        value: c.value ?? \"-\",\n        cls: mod > 0 ? \"is-up\" : mod \u003c 0 ? \"is-down\" : \"\",\n        hint: c.bonus !== undefined ? `${L(\"WFRPPD.Stats.Bonus\")} ${c.bonus}` : \"\"\n      };\n    };\n    const row = (labelKey, value, cls = \"\") => ({\n      label: L(labelKey),\n      value: value === undefined || value === null || value === \"\" ? \"-\" : value,\n      cls\n    });\n    const pair = (a, b) => (a === undefined || a === null ? \"-\" : `${a} / ${b ?? \"-\"}`);\n    const dmg = (items) => {\n      const w = items[0];\n      if (!w) return \"-\";\n      const d = safe(() => w.system.Damage);\n      return d === null || d === undefined || d === \"\" ? \"-\" : `+${d}`;\n    };\n    const ap = (loc) => st.armour?.[loc]?.value ?? 0;\n    const ranged = weapons.find((w) => safe(() => w.system.isRanged));\n\n    const wounds = st.wounds ?? {};\n    const woundsCls = wounds.max && wounds.value \u003c wounds.max ? \"is-down\" : \"\";\n\n    return {\n      physical: [\"ws\", \"bs\", \"s\", \"t\", \"i\", \"ag\"].map(charRow),\n      mental: [\n        ...[\"dex\", \"int\", \"wp\", \"fel\"].map(charRow),\n        row(\"WFRPPD.Stats.Move\", det.move?.value),\n        row(\"WFRPPD.Stats.Run\", det.move?.run)\n      ],\n      defence: [\n        row(\"WFRPPD.Wounds\", pair(wounds.value, wounds.max), woundsCls),\n        row(\"WFRPPD.Stats.Crits\", pair(st.criticalWounds?.value ?? 0, st.criticalWounds?.max), (st.criticalWounds?.value ?? 0) > 0 ? \"is-down\" : \"\"),\n        row(cfg.locations?.head ?? \"head\", ap(\"head\"), \"is-armour\"),\n        row(cfg.locations?.body ?? \"body\", ap(\"body\"), \"is-armour\"),\n        row(\"WFRPPD.Stats.Arms\", `${ap(\"rArm\")} / ${ap(\"lArm\")}`, \"is-armour\"),\n        row(\"WFRPPD.Stats.Legs\", `${ap(\"rLeg\")} / ${ap(\"lLeg\")}`, \"is-armour\")\n      ],\n      combat: [\n        row(\"WFRPPD.Stats.MainDmg\", dmg(mainItems), \"is-melee\"),\n        row(\"WFRPPD.Stats.OffDmg\", dmg(offItems), \"is-melee\"),\n        row(\"WFRPPD.Stats.RangedDmg\", ranged ? dmg([ranged]) : \"-\", \"is-melee\"),\n        row(\"WFRPPD.Stats.SB\", chars.s?.bonus),\n        row(\"WFRPPD.Stats.TB\", chars.t?.bonus),\n        row(\"WFRPPD.Stats.Advantage\", st.advantage?.value ?? 0)\n      ],\n      fate: [\n        row(\"WFRPPD.Stats.Fate\", st.fate?.value, \"is-fate\"),\n        row(\"WFRPPD.Stats.Fortune\", st.fortune?.value, \"is-fate\"),\n        row(\"WFRPPD.Stats.Resilience\", st.resilience?.value, \"is-fate\"),\n        row(\"WFRPPD.Stats.Resolve\", st.resolve?.value, \"is-fate\"),\n        row(\"WFRPPD.Stats.Corruption\", pair(st.corruption?.value ?? 0, st.corruption?.max), \"is-chaos\"),\n        row(\"WFRPPD.Stats.Sin\", st.sin?.value ?? 0, (st.sin?.value ?? 0) > 0 ? \"is-sin\" : \"\")\n      ]\n    };\n  }\n\n  /** Категории для вкладки «Характеристики» справа (как аддон ECS) */\n  _statCategories(sets) {\n    const sys = this.actor.system;\n    const L = (key) => game.i18n.localize(key);\n    const det = sys.details ?? {};\n    const exp = det.experience;\n    const enc = sys.status?.encumbrance ?? {};\n    const row = (labelKey, value, cls = \"\") => ({\n      label: L(labelKey),\n      value: value === undefined || value === null || value === \"\" ? \"-\" : value,\n      cls\n    });\n\n    const cats = [\n      {\n        key: \"general\",\n        rows: [\n          row(\"WFRPPD.Stats.Move\", det.move?.value),\n          row(\"WFRPPD.Stats.Walk\", det.move?.walk),\n          row(\"WFRPPD.Stats.Run\", det.move?.run),\n          row(\"WFRPPD.Encumbrance\", `${Number(enc.current) || 0} / ${Number(enc.max) || 0}`)\n        ]\n      },\n      { key: \"physical\", rows: sets.physical },\n      { key: \"mental\", rows: sets.mental.slice(0, 4) },\n      { key: \"combat\", rows: sets.combat },\n      { key: \"defence\", rows: sets.defence },\n      { key: \"fate\", rows: sets.fate }\n    ];\n    if (exp)\n      cats.push({\n        key: \"experience\",\n        rows: [\n          row(\"WFRPPD.Stats.ExpTotal\", exp.total),\n          row(\"WFRPPD.Stats.ExpSpent\", exp.spent),\n          row(\"WFRPPD.Stats.ExpCurrent\", exp.current, \"is-up\")\n        ]\n      });\n    return cats.map((c) => ({ ...c, label: L(`WFRPPD.Stats.Set.${c.key}`) }));\n  }\n\n  _itemView(item, editable, extra = {}) {\n    const sys = item.system;\n    const qty = sys.quantity?.value ?? 1;\n    return {\n      id: item.id,\n      name: item.name,\n      img: item.img,\n      rarity: RARITY[sys.availability?.value] ?? \"none\",\n      qty: qty > 1 ? qty : null,\n      draggable: editable && !extra.ghost,\n      equippable: !!sys.isEquippable && this._defaultSlot(item) !== null,\n      ghost: !!extra.ghost\n    };\n  }\n\n  _matchesFilter(item, filter) {\n    switch (filter) {\n      case \"weapon\":\n        return item.type === \"weapon\" || item.type === \"ammunition\";\n      case \"armour\":\n        return item.type === \"armour\";\n      case \"clothing\":\n        return (\n          item.type === \"container\" ||\n          (item.type === \"trapping\" && item.system.trappingType?.value === \"clothingAccessories\")\n        );\n      case \"other\":\n        return ![\"weapon\", \"ammunition\", \"armour\", \"container\"].includes(item.type) &&\n          !(item.type === \"trapping\" && item.system.trappingType?.value === \"clothingAccessories\");\n      default:\n        return true;\n    }\n  }\n\n  /* -------------------------------------------- */\n  /*  Правила слотов                              */\n  /* -------------------------------------------- */\n\n  /** Можно ли положить предмет в этот слот */\n  _canDrop(item, slot) {\n    if (!item) return false;\n    const sys = item.system;\n    if (LOCATIONS.includes(slot)) return item.type === \"armour\" && !!sys.protects?.[slot];\n    if (slot === \"main\" || slot === \"off\") return item.type === \"weapon\";\n    if (slot === \"accessory\")\n      return item.type === \"trapping\" && sys.trappingType?.value === \"clothingAccessories\";\n    if (slot === \"container\") return item.type === \"container\";\n    return false;\n  }\n\n  /** Слот по умолчанию для двойного клика */\n  _defaultSlot(item) {\n    const sys = item.system;\n    if (item.type === \"armour\") return LOCATIONS.find((l) => sys.protects?.[l]) ?? null;\n    if (item.type === \"container\") return \"container\";\n    if (item.type === \"trapping\")\n      return sys.trappingType?.value === \"clothingAccessories\" ? \"accessory\" : null;\n    if (item.type === \"weapon\") {\n      if (sys.twohanded?.value) return \"main\";\n      const equippedWeapons = this.actor.itemTypes.weapon.filter((w) => w.system.isEquipped);\n      const mainBusy = equippedWeapons.some((w) => !w.system.offhand?.value);\n      const offBusy = equippedWeapons.some((w) => w.system.offhand?.value || w.system.twohanded?.value);\n      const isShield = !!safe(() => sys.properties?.qualities?.shield, false);\n      if (isShield && !offBusy) return \"off\";\n      if (mainBusy && !offBusy) return \"off\";\n      return \"main\";\n    }\n    return null;\n  }\n\n  /** Предмет сейчас лежит именно в этом слоте */\n  _isInSlot(item, slot) {\n    if (!item.system.isEquipped || !this._canDrop(item, slot)) return false;\n    if (item.type === \"weapon\") {\n      const off = !!item.system.offhand?.value;\n      return slot === \"off\" ? off : !off;\n    }\n    return true;\n  }\n\n  /** Что сейчас в слоте и чем его можно заменить (для быстрой смены) */\n  _swapCandidates(slot) {\n    const fits = this.actor.items.filter((i) => this._canDrop(i, slot));\n    const current = fits.filter((i) => this._isInSlot(i, slot));\n    let available = fits.filter((i) => !this._isInSlot(i, slot));\n    // Двуручное во вторую руку не предлагаем - оно всё равно уйдёт в основную\n    if (slot === \"off\") available = available.filter((i) => !i.system.twohanded?.value);\n    const byName = (a, b) => a.name.localeCompare(b.name, game.i18n.lang);\n    return { current: current.sort(byName), available: available.sort(byName) };\n  }\n\n  /** Где сейчас надет предмет (для подписи «сейчас: ...») */\n  _currentSlotOf(item) {\n    if (!item.system.isEquipped) return null;\n    if (item.type === \"weapon\") return item.system.offhand?.value ? \"off\" : \"main\";\n    return null;\n  }\n\n  async _equipTo(item, slot) {\n    if (!this.editable) return;\n    if (!this._canDrop(item, slot)) {\n      ui.notifications.warn(\n        game.i18n.format(\"WFRPPD.Warn.WrongSlot\", {\n          item: item.name,\n          slot: this._slotLabel(slot)\n        })\n      );\n      return;\n    }\n\n    try {\n      if (item.type === \"weapon\") await this._equipWeapon(item, slot);\n      else if (!item.system.isEquipped) await item.update({ \"system.equipped.value\": true });\n    } catch (err) {\n      // Система сама показывает уведомление (например, лимит экипированного оружия)\n      console.warn(`${MODULE_ID} | equip failed`, err);\n    }\n  }\n\n  async _equipWeapon(item, slot) {\n    const sys = item.system;\n    const twoHanded = !!sys.twohanded?.value;\n    const wantOff = slot === \"off\" && !twoHanded;\n\n    // Как в WoW: то, что мешает, снимается автоматически\n    const conflicts = this.actor.itemTypes.weapon.filter((w) => {\n      if (w.id === item.id || !w.system.isEquipped) return false;\n      if (twoHanded || w.system.twohanded?.value) return true;\n      return !!w.system.offhand?.value === wantOff;\n    });\n    if (conflicts.length) {\n      await this.actor.updateEmbeddedDocuments(\n        \"Item\",\n        conflicts.map((w) => ({ _id: w.id, \"system.equipped.value\": false }))\n      );\n    }\n\n    // Порядок важен: при смене equipped система сбрасывает offhand,\n    // поэтому сначала надеваем, потом выставляем руку отдельным апдейтом\n    if (!sys.isEquipped) await item.update({ \"system.equipped.value\": true });\n    if (!!item.system.offhand?.value !== wantOff) await item.update({ \"system.offhand.value\": wantOff });\n  }\n\n  async _unequip(item) {\n    if (!this.editable || !item?.system?.isEquipped) return;\n    try {\n      await item.update({ \"system.equipped.value\": false });\n    } catch (err) {\n      console.warn(`${MODULE_ID} | unequip failed`, err);\n    }\n  }\n\n  _slotLabel(slot) {\n    if (LOCATIONS.includes(slot)) return game.i18n.localize(game.wfrp4e.config.locations[slot]);\n    const map = { main: \"Main\", off: \"Off\", accessory: \"Accessory\", container: \"Container\" };\n    return game.i18n.localize(`WFRPPD.Slot.${map[slot] ?? slot}`);\n  }\n\n  /* -------------------------------------------- */\n  /*  События                                     */\n  /* -------------------------------------------- */\n\n  static onSetFilter(event, target) {\n    this._filter = target.dataset.filter ?? \"all\";\n    this._saveUiState();\n    this.render();\n  }\n\n  static onSetTab(event, target) {\n    this._tab = target.dataset.tab === \"stats\" ? \"stats\" : \"bag\";\n    this._saveUiState();\n    this.render();\n  }\n\n  static onOpenSheet() {\n    this.actor.sheet?.render(true);\n  }\n\n  async _onRender(context, options) {\n    await super._onRender(context, options);\n    PaperdollTooltip.hide();\n    const root = this.element;\n\n    for (const el of root.querySelectorAll(\".pd-item\")) {\n      const item = this.actor.items.get(el.dataset.itemId);\n      if (!item) continue;\n\n      el.addEventListener(\"pointerenter\", (ev) => PaperdollTooltip.show(item, ev));\n      el.addEventListener(\"pointermove\", (ev) => PaperdollTooltip.move(ev));\n      el.addEventListener(\"pointerleave\", () => PaperdollTooltip.hide());\n\n      el.addEventListener(\"contextmenu\", (ev) => {\n        ev.preventDefault();\n        PaperdollTooltip.hide();\n        item.sheet?.render(true);\n      });\n\n      if (el.classList.contains(\"is-ghost\")) continue;\n\n      el.addEventListener(\"dblclick\", (ev) => {\n        ev.preventDefault();\n        PaperdollTooltip.hide();\n        if (item.system.isEquipped) this._unequip(item);\n        else {\n          const slot = this._defaultSlot(item);\n          if (slot) this._equipTo(item, slot);\n        }\n      });\n\n      if (!this.editable) continue;\n      el.addEventListener(\"dragstart\", (ev) => this._onDragStart(ev, item, el));\n      el.addEventListener(\"dragend\", () =>
