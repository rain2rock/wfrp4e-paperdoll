<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperdoll Mock</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  html, body { margin: 0; background: #2f3237; font-family: "Signika", "Segoe UI", system-ui, sans-serif; }
  body { padding: 20px; }
  .mock-note { color: #cfcfcf; font-size: 13px; margin: 0 0 12px; max-width: 960px; line-height: 1.4; }
  #mock-reopen { margin-bottom: 12px; }
  .mock-gm { display: inline-flex; gap: 6px; align-items: center; color: #cfcfcf; font-size: 13px; margin: 0 0 12px; cursor: pointer; }
  .app.window-app { max-width: 100%; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); border: 1px solid #000; }
  .window-header { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 12px; background: #0b0a09;
    color: #e8dcc4; font-size: 14px; border-bottom: 1px solid #4a4339; flex: 0 0 auto; }
  .window-header .window-title { flex: 1; }
  .window-header .header-control { background: none; border: none; color: #e8dcc4; cursor: pointer; font-size: 14px; }
  .window-content { flex: 1; min-height: 0; }
  .mock-toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 4px;
    font-size: 13px; z-index: 20000; color: #fff; background: #6a1c14; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .mock-toast--info { background: #2b3a55; }
  @media (max-width: 760px) {
    body { padding: 8px; }
    .app.window-app { height: auto !important; }
    .wfrp-paperdoll .pd-root { grid-template-columns: 1fr; }
    .wfrp-paperdoll .pd-side { min-height: 360px; border-left: none; border-top: 1px solid #4a4339; }
  }
/* ==========================================================
   WFRP4e Paperdoll - окно персонажа в стиле WoW
   ========================================================== */

.wfrp-paperdoll,
.wfrp-paperdoll-tooltip,
.wfrp-paperdoll-flyout {
  --pd-bg: #0f0d0b;
  --pd-bg-2: #1a1612;
  --pd-panel: #15120f;
  --pd-frame: #4a4339;
  --pd-frame-hi: #6e6556;
  --pd-gold: #ffd100;
  --pd-gold-soft: #c9a45c;
  --pd-text: #f0e6d2;
  --pd-text-dim: #a89c86;
  --pd-text-2: #d8ccb4;
  --pd-muted: #8a7a5e;
  --pd-ink: #ffffff;
  --pd-shadow: #000;
  --pd-well: #0b0907;
  --pd-tt-bg: rgba(8, 8, 18, 0.95);
  --pd-fly-bg: rgba(14, 12, 10, 0.97);
  --pd-good: #9dff8a;
  --pd-bad: #ff4f4f;
  --pd-warn: #ffb37a;
  --pd-rare-text: #3a8dff;
  --pd-exotic-text: #b45cff;

  --pd-up: #1eff00;
  --pd-down: #ff3b30;
  --pd-fate: #69ccf0;
  --pd-chaos: #c26cff;
  --pd-melee: #ff9a5a;

  /* Цвета редкости как в WoW */
  --rarity-none: #9d9d9d;
  --rarity-common: #ffffff;
  --rarity-scarce: #1eff00;
  --rarity-rare: #0070dd;
  --rarity-exotic: #a335ee;
}

.wfrp-paperdoll .window-content {
  padding: 0;
  background: radial-gradient(ellipse at 40% 35%, #231c15 0%, var(--pd-bg) 75%), var(--pd-bg);
  color: var(--pd-text);
  overflow: hidden;
}

.wfrp-paperdoll .pd-root {
  display: grid;
  grid-template-columns: minmax(560px, 1fr) minmax(260px, 300px);
  height: 100%;
  min-height: 0;
}

/* ---------- Шапка с портретом ---------- */

.wfrp-paperdoll .pd-main {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}

.wfrp-paperdoll .pd-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(180deg, #1d1813, #110e0b);
  border-bottom: 1px solid var(--pd-frame);
}
.wfrp-paperdoll .pd-hero-portrait {
  flex: 0 0 56px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--pd-gold-soft);
  box-shadow: 0 0 0 2px #2a2016, 0 0 12px rgba(201, 164, 92, 0.35);
  cursor: pointer;
}
.wfrp-paperdoll .pd-hero-portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  border: none;
}
.wfrp-paperdoll .pd-hero-text { min-width: 0; text-align: center; flex: 1; }
/* Иконка карьеры справа: симметрично портрету слева */
.wfrp-paperdoll .pd-hero-career {
  flex: 0 0 56px;
  width: 56px;
  height: 56px;
  border-radius: 6px;
  overflow: hidden;
  border: 2px solid var(--pd-gold-soft);
  box-shadow: 0 0 0 2px #2a2016, 0 0 12px rgba(201, 164, 92, 0.35);
}
.wfrp-paperdoll .pd-hero-career img { width: 100%; height: 100%; object-fit: cover; border: none; }
.wfrp-paperdoll .pd-hero-career.is-empty { border-color: transparent; box-shadow: none; }
.wfrp-paperdoll .pd-hero-name {
  font-size: 19px;
  font-weight: 700;
  color: var(--pd-text);
  text-shadow: 0 1px 2px var(--pd-shadow);
}
.wfrp-paperdoll .pd-hero-sub {
  font-size: 13px;
  color: var(--pd-gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Куколка ---------- */

.wfrp-paperdoll .pd-doll {
  flex: 1;
  display: grid;
  grid-template-columns: 82px 1fr 82px;
  grid-template-rows: 1fr auto;
  grid-template-areas:
    "left center right"
    "left weapons right";
  gap: 8px 10px;
  padding: 12px;
  min-height: 0;
  overflow: auto;
}

.wfrp-paperdoll .pd-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.wfrp-paperdoll .pd-group--left { grid-area: left; }
.wfrp-paperdoll .pd-group--right { grid-area: right; }
.wfrp-paperdoll .pd-group--weapons {
  grid-area: weapons;
  flex-direction: row;
  justify-content: center;
  gap: 18px;
}

/* ---------- Слот: квадрат + стрелочка ---------- */

.wfrp-paperdoll .pd-slot {
  display: flex;
  align-items: center;
  gap: 4px;
}

.wfrp-paperdoll .pd-slot-frame {
  position: relative;
  flex: 0 0 56px;
  width: 56px;
  height: 56px;
  padding: 3px;
  border-radius: 5px;
  background: linear-gradient(145deg, #2b2620, #0c0a08);
  border: 1px solid var(--pd-frame);
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
}

.wfrp-paperdoll .pd-slot-placeholder {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  border-radius: 3px;
  background: radial-gradient(circle, #1c1814 0%, var(--pd-well) 80%);
  color: #3d352b;
  font-size: 22px;
}

/* AP и количество слоёв поверх иконки */
.wfrp-paperdoll .pd-ap,
.wfrp-paperdoll .pd-layers {
  position: absolute;
  z-index: 2;
  min-width: 18px;
  padding: 0 4px;
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  border-radius: 8px;
  pointer-events: auto;
}
.wfrp-paperdoll .pd-ap {
  right: -6px;
  bottom: -6px;
  color: var(--pd-ink);
  background: #2c2620;
  border: 1px solid var(--pd-gold-soft);
}
.wfrp-paperdoll .pd-layers {
  right: -6px;
  top: -6px;
  color: #1a140e;
  background: var(--pd-gold-soft);
}

/* Подсветка при перетаскивании */
.wfrp-paperdoll .pd-slot.is-valid .pd-slot-frame {
  border-color: var(--pd-gold);
  box-shadow: 0 0 12px rgba(255, 209, 0, 0.5), inset 0 0 8px rgba(0, 0, 0, 0.9);
}
.wfrp-paperdoll .pd-slot.is-invalid .pd-slot-frame { opacity: 0.4; }

/* ---------- Иконка предмета + свечение редкости ---------- */

.wfrp-paperdoll .pd-item {
  --glow: var(--rarity-none);
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 3px;
  background: var(--pd-well);
  cursor: grab;
  border: 1px solid var(--glow);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.8),
    0 0 6px -1px var(--glow),
    inset 0 0 8px -2px var(--glow);
  transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
}
.wfrp-paperdoll .pd-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
  border-radius: 2px;
  pointer-events: none;
}
.wfrp-paperdoll .pd-item:hover {
  filter: brightness(1.2);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.8),
    0 0 14px 1px var(--glow),
    inset 0 0 12px -2px var(--glow);
}

.wfrp-paperdoll .pd-item.rarity-none { --glow: var(--rarity-none); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8); }
.wfrp-paperdoll .pd-item.rarity-common { --glow: var(--rarity-common); }
.wfrp-paperdoll .pd-item.rarity-scarce { --glow: var(--rarity-scarce); }
.wfrp-paperdoll .pd-item.rarity-rare { --glow: var(--rarity-rare); }
.wfrp-paperdoll .pd-item.rarity-exotic {
  --glow: var(--rarity-exotic);
  animation: pd-epic-pulse 2.6s ease-in-out infinite;
}
@keyframes pd-epic-pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8), 0 0 6px -1px var(--glow), inset 0 0 8px -2px var(--glow); }
  50% { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.8), 0 0 13px 1px var(--glow), inset 0 0 12px -1px var(--glow); }
}

.wfrp-paperdoll .pd-item.is-dragging { opacity: 0.35; }
.wfrp-paperdoll .pd-item.is-ghost {
  opacity: 0.35;
  filter: grayscale(0.9);
  cursor: default;
  animation: none;
}
.wfrp-paperdoll .pd-item.is-plain { cursor: default; }
.wfrp-paperdoll .is-readonly .pd-item { cursor: default; }

.wfrp-paperdoll .pd-qty {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 11px;
  font-weight: 700;
  color: var(--pd-ink);
  text-shadow: 0 0 2px var(--pd-shadow), 0 0 2px var(--pd-shadow), 0 0 2px var(--pd-shadow);
}

/* ---------- Быстрая смена: стрелочка ---------- */

.wfrp-paperdoll .pd-swap {
  flex: 0 0 18px;
  width: 18px;
  min-width: 18px;
  height: 40px;
  min-height: 0;
  margin: 0;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  line-height: 1;
  color: var(--pd-gold);
  background: linear-gradient(90deg, #2a221a, #3a2f22);
  border: 1px solid var(--pd-frame-hi);
  border-radius: 3px;
  box-shadow: none;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 0.12s, transform 0.12s, background 0.12s;
}
.wfrp-paperdoll .pd-swap i { margin: 0; }
.wfrp-paperdoll .pd-slot:hover .pd-swap,
.wfrp-paperdoll .pd-swap:focus-visible,
.wfrp-paperdoll .pd-swap.is-open {
  opacity: 1;
  transform: none;
}
.wfrp-paperdoll .pd-swap:hover,
.wfrp-paperdoll .pd-swap.is-open {
  color: #1a140e;
  background: var(--pd-gold);
  border-color: var(--pd-gold);
}
@media (hover: none) {
  .wfrp-paperdoll .pd-swap { opacity: 0.8; transform: none; }
}

/* ---------- Центр: «модель» и панели статов ---------- */

.wfrp-paperdoll .pd-center {
  grid-area: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  min-height: 0;
}

.wfrp-paperdoll .pd-model {
  position: relative;
  flex: 1;
  min-height: 200px;
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  background: var(--pd-well);
  border: 1px solid var(--pd-frame);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
}
.wfrp-paperdoll .pd-model img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  border: none;
  opacity: 0.92;
}
.wfrp-paperdoll .pd-model::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
  pointer-events: none;
}

/* Нагрузка - тонкая полоска внизу модели */
.wfrp-paperdoll .pd-enc {
  position: absolute;
  z-index: 1;
  left: 8px;
  right: 8px;
  bottom: 8px;
  height: 18px;
  border: 1px solid var(--pd-frame);
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.75);
  overflow: hidden;
}
.wfrp-paperdoll .pd-enc-fill {
  height: 100%;
  background: linear-gradient(180deg, #8a7040, #4f3f22);
}
.wfrp-paperdoll .pd-enc.is-over .pd-enc-fill { background: linear-gradient(180deg, #d08a1f, #7a4a0e); }
.wfrp-paperdoll .pd-enc.is-max .pd-enc-fill { background: linear-gradient(180deg, #c0392b, #6e1810); }
.wfrp-paperdoll .pd-enc span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: var(--pd-ink);
  text-shadow: 0 1px 2px var(--pd-shadow);
}

.wfrp-paperdoll .pd-statboxes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.wfrp-paperdoll .pd-statbox {
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid var(--pd-frame);
  border-radius: 4px;
  overflow: hidden;
}

/* Выпадашка как в WoW: тёмная плашка и жёлтая кнопка-стрелка */
.wfrp-paperdoll .pd-select {
  position: relative;
  display: block;
  margin: 4px;
  border: 1px solid var(--pd-frame-hi);
  border-radius: 3px;
  background: linear-gradient(180deg, #2a2620, #141210);
}
.wfrp-paperdoll .pd-select select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 24px;
  margin: 0;
  padding: 0 30px 0 8px;
  font-size: 13px;
  color: var(--pd-text);
  background: transparent;
  border: none;
  outline: none;
  box-shadow: none;
  cursor: pointer;
}
.wfrp-paperdoll .pd-select select option { background: #1a1612; color: var(--pd-text); }
.wfrp-paperdoll .pd-select i {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 20px;
  height: 18px;
  display: grid;
  place-items: center;
  font-size: 12px;
  color: #3a2a00;
  background: linear-gradient(180deg, #ffe066, #c99a00);
  border-radius: 2px;
  pointer-events: none;
}

.wfrp-paperdoll .pd-statlist { padding: 2px 8px 6px; }
.wfrp-paperdoll .pd-stat {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-size: 13px;
  line-height: 19px;
}
.wfrp-paperdoll .pd-stat-label {
  color: var(--pd-gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll .pd-stat-value { color: var(--pd-text); font-variant-numeric: tabular-nums; white-space: nowrap; }


/* ---------- Правая панель: вкладки ---------- */

.wfrp-paperdoll .pd-side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-left: 1px solid var(--pd-frame);
  background: rgba(0, 0, 0, 0.35);
  transition: box-shadow 0.15s;
}
.wfrp-paperdoll .pd-side.is-valid { box-shadow: inset 0 0 18px rgba(255, 209, 0, 0.3); }

.wfrp-paperdoll .pd-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 8px 0;
  border-bottom: 1px solid var(--pd-frame);
}
.wfrp-paperdoll .pd-tab {
  flex: 1;
  height: 28px;
  margin: 0;
  padding: 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--pd-text-dim);
  background: linear-gradient(180deg, #221c16, #15110d);
  border: 1px solid var(--pd-frame);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  box-shadow: none;
  cursor: pointer;
}
.wfrp-paperdoll .pd-tab:hover { color: var(--pd-text); }
.wfrp-paperdoll .pd-tab.is-active {
  color: var(--pd-ink);
  background: linear-gradient(180deg, #8b1a12, #4a0d08);
  border-color: #b8322a;
}

.wfrp-paperdoll .pd-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px;
}
.wfrp-paperdoll .pd-filter {
  flex: 0 0 auto;
  width: auto;
  height: auto;
  margin: 0;
  padding: 2px 8px;
  font-size: 11px;
  line-height: 18px;
  color: var(--pd-text-dim);
  background: #1a1612;
  border: 1px solid var(--pd-frame);
  border-radius: 10px;
  box-shadow: none;
  cursor: pointer;
}
.wfrp-paperdoll .pd-filter:hover { color: var(--pd-text); }
.wfrp-paperdoll .pd-filter.is-active { color: #1a140e; background: var(--pd-gold); border-color: var(--pd-gold); }
.wfrp-paperdoll .pd-filter-count { opacity: 0.7; }

.wfrp-paperdoll .pd-bag-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, 46px);
  grid-auto-rows: 46px;
  gap: 8px;
  align-content: start;
  padding: 6px 10px 10px;
  overflow-y: auto;
}
.wfrp-paperdoll .pd-bag-empty {
  grid-column: 1 / -1;
  padding: 20px 0;
  text-align: center;
  color: var(--pd-text-dim);
  font-style: italic;
}
.wfrp-paperdoll .pd-bag-hint {
  padding: 6px 10px 8px;
  font-size: 11px;
  color: var(--pd-text-dim);
  border-top: 1px solid var(--pd-frame);
}

/* ---------- Вкладка «Характеристики» (как аддон ECS) ---------- */

.wfrp-paperdoll .pd-ecs {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px 12px;
}
.wfrp-paperdoll .pd-ecs-cat + .pd-ecs-cat { margin-top: 10px; }
.wfrp-paperdoll .pd-ecs-head {
  font-size: 15px;
  font-weight: 700;
  color: var(--pd-gold);
  text-shadow: 0 1px 2px var(--pd-shadow);
  margin-bottom: 2px;
}
.wfrp-paperdoll .pd-ecs-row {
  padding-left: 12px;
  font-size: 13px;
  line-height: 19px;
  color: var(--pd-text-2);
}
.wfrp-paperdoll .pd-ecs-value { color: var(--pd-text); font-variant-numeric: tabular-nums; }

/* Цвета значений (общие для панелей и вкладки статов) */
.wfrp-paperdoll span.is-up { color: var(--pd-up); }
.wfrp-paperdoll span.is-down { color: var(--pd-down); }
.wfrp-paperdoll span.is-fate { color: var(--pd-fate); }
.wfrp-paperdoll span.is-chaos { color: var(--pd-chaos); }
.wfrp-paperdoll span.is-sin { color: var(--pd-down); }
.wfrp-paperdoll span.is-melee { color: var(--pd-melee); }
.wfrp-paperdoll span.is-armour { color: var(--pd-ink); }

/* Кнопка в шапке листа персонажа */
.wfrp-paperdoll-open { color: inherit; }

/* ==========================================================
   Тултип (висит в body)
   ========================================================== */

.wfrp-paperdoll-tooltip {
  position: fixed;
  z-index: 10000;
  display: none;
  max-width: 300px;
  padding: 8px 10px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--pd-text);
  background: var(--pd-tt-bg);
  border: 1px solid #a0a0b4;
  border-radius: 5px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
  pointer-events: none;
}
.wfrp-paperdoll-tooltip.is-visible { display: block; }

.wfrp-paperdoll-tooltip .pd-tt-name { font-size: 15px; font-weight: 700; color: var(--rarity-none); }
.wfrp-paperdoll-tooltip .rarity-common { color: var(--rarity-common); }
.wfrp-paperdoll-tooltip .rarity-scarce { color: var(--rarity-scarce); }
.wfrp-paperdoll-tooltip .rarity-rare { color: var(--pd-rare-text); }
.wfrp-paperdoll-tooltip .rarity-exotic { color: var(--pd-exotic-text); }

.wfrp-paperdoll-tooltip .pd-tt-sub { color: var(--pd-text-dim); font-size: 12px; margin-bottom: 4px; }
.wfrp-paperdoll-tooltip .pd-tt-row { display: flex; justify-content: space-between; gap: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-stat { color: var(--pd-ink); }
.wfrp-paperdoll-tooltip .pd-tt-quality { color: var(--pd-up); margin-top: 4px; }
.wfrp-paperdoll-tooltip .pd-tt-flaw { color: var(--pd-bad); margin-top: 2px; }
.wfrp-paperdoll-tooltip .pd-tt-desc { color: var(--pd-gold); margin-top: 6px; font-style: italic; }
.wfrp-paperdoll-tooltip .pd-tt-props { margin-top: 6px; display: grid; gap: 1px; }
.wfrp-paperdoll-tooltip .pd-tt-prop { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-prop span:first-child { color: var(--pd-text-dim); }
.wfrp-paperdoll-tooltip .pd-tt-prop span:last-child { color: var(--pd-ink); text-align: right; }
.wfrp-paperdoll-tooltip .pd-tt-text { margin-top: 6px; color: var(--pd-text-2); font-size: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-more { margin-top: 4px; font-size: 11px; color: var(--pd-muted); font-style: italic; }
.wfrp-paperdoll-tooltip .pd-tt-footer { color: var(--pd-text-dim); margin-top: 6px; font-size: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-avail { font-size: 12px; }
.wfrp-paperdoll-tooltip .pd-tt-hint { margin-top: 6px; font-size: 11px; color: var(--pd-muted); }

/* ==========================================================
   Быстрая смена: выпадающий список (висит в body)
   ========================================================== */

.wfrp-paperdoll-flyout {
  position: fixed;
  z-index: 9999;
  width: 280px;
  max-height: 380px;
  overflow-y: auto;
  padding: 6px;
  color: var(--pd-text);
  background: var(--pd-fly-bg);
  border: 1px solid #c9a45c;
  border-radius: 5px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
  font-size: 13px;
  animation: pd-fly-in 0.12s ease-out;
}
@keyframes pd-fly-in {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: none; }
}
.wfrp-paperdoll-flyout .pd-fly-title {
  padding: 2px 6px 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pd-gold);
  border-bottom: 1px solid var(--pd-frame);
}
.wfrp-paperdoll-flyout .pd-fly-section {
  padding: 8px 6px 4px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--pd-muted);
}
.wfrp-paperdoll-flyout .pd-fly-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 4px;
  cursor: pointer;
}
.wfrp-paperdoll-flyout .pd-fly-row:hover { background: rgba(255, 209, 0, 0.1); }
.wfrp-paperdoll-flyout .pd-fly-icon {
  --glow: var(--rarity-none);
  position: relative;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border: 1px solid var(--glow);
  border-radius: 3px;
  background: var(--pd-well);
  box-shadow: 0 0 6px -1px var(--glow), inset 0 0 6px -2px var(--glow);
}
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-none { box-shadow: none; }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-common { --glow: var(--rarity-common); }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-scarce { --glow: var(--rarity-scarce); }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-rare { --glow: var(--rarity-rare); }
.wfrp-paperdoll-flyout .pd-fly-icon.rarity-exotic { --glow: var(--rarity-exotic); }
.wfrp-paperdoll-flyout .pd-fly-icon img { width: 100%; height: 100%; object-fit: cover; border: none; }
.wfrp-paperdoll-flyout .pd-fly-icon .pd-qty {
  position: absolute;
  right: 1px;
  bottom: -1px;
  font-size: 10px;
  font-weight: 700;
  color: var(--pd-ink);
  text-shadow: 0 0 2px var(--pd-shadow), 0 0 2px var(--pd-shadow);
}
.wfrp-paperdoll-flyout .pd-fly-text { flex: 1; min-width: 0; }
.wfrp-paperdoll-flyout .pd-fly-name {
  font-weight: 700;
  color: var(--rarity-none);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll-flyout .pd-fly-name.rarity-common { color: var(--rarity-common); }
.wfrp-paperdoll-flyout .pd-fly-name.rarity-scarce { color: var(--rarity-scarce); }
.wfrp-paperdoll-flyout .pd-fly-name.rarity-rare { color: var(--pd-rare-text); }
.wfrp-paperdoll-flyout .pd-fly-name.rarity-exotic { color: var(--pd-exotic-text); }
.wfrp-paperdoll-flyout .pd-fly-meta {
  font-size: 11px;
  color: var(--pd-text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll-flyout .pd-fly-act { color: var(--pd-text-dim); font-size: 13px; padding: 4px; }
.wfrp-paperdoll-flyout .pd-fly-row:hover .pd-fly-act { color: var(--pd-bad); }
.wfrp-paperdoll-flyout .pd-fly-empty { padding: 8px 6px; font-style: italic; color: var(--pd-muted); }

/* ==========================================================
   BIS: только в списке быстрой смены
   ========================================================== */

/* Строка BIS в списке быстрой смены */
.wfrp-paperdoll-flyout .pd-fly-row.is-bis {
  background: linear-gradient(90deg, rgba(255, 209, 0, 0.16), rgba(255, 209, 0, 0.02) 70%);
  box-shadow: inset 2px 0 0 #ffd100;
}
.wfrp-paperdoll-flyout .pd-fly-row.is-bis:hover {
  background: linear-gradient(90deg, rgba(255, 209, 0, 0.26), rgba(255, 209, 0, 0.06) 70%);
}
.wfrp-paperdoll-flyout .pd-fly-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex: 0 0 auto;
}
.wfrp-paperdoll-flyout .pd-fly-bis {
  padding: 0 5px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  line-height: 15px;
  color: #1a1200;
  background: linear-gradient(180deg, #ffe066, #d4a000);
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(255, 209, 0, 0.55);
}
.wfrp-paperdoll-flyout .pd-fly-delta {
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.wfrp-paperdoll-flyout .pd-fly-delta.is-up { color: var(--pd-up); }
.wfrp-paperdoll-flyout .pd-fly-delta.is-down { color: var(--pd-bad); }
.wfrp-paperdoll-flyout .pd-fly-delta.is-same { color: var(--pd-text-dim); }

/* ==========================================================
   Ограничения в списке быстрой смены
   ========================================================== */

.wfrp-paperdoll-flyout .pd-fly-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 3px;
}
.wfrp-paperdoll-flyout .pd-chip {
  padding: 0 5px;
  font-size: 10px;
  line-height: 15px;
  border-radius: 3px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.wfrp-paperdoll-flyout .pd-chip.is-forbid { color: var(--pd-ink); background: #8b1a12; border-color: #c0392b; }
.wfrp-paperdoll-flyout .pd-chip.is-warn { color: var(--pd-warn); background: rgba(255, 120, 40, 0.12); border-color: rgba(255, 140, 60, 0.4); }
.wfrp-paperdoll-flyout .pd-chip.is-info { color: var(--pd-text-dim); background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.12); }

/* Запрещённое по правилам: можно надеть, но выглядит «выключенным» */
.wfrp-paperdoll-flyout .pd-fly-row.is-forbidden .pd-fly-icon,
.wfrp-paperdoll-flyout .pd-fly-row.is-forbidden .pd-fly-name,
.wfrp-paperdoll-flyout .pd-fly-row.is-forbidden .pd-fly-meta { opacity: 0.5; }
.wfrp-paperdoll-flyout .pd-fly-row.is-forbidden .pd-fly-icon { filter: grayscale(0.7); }

/* ==========================================================
   Лента эффектов поверх модели (как баффы/дебаффы в WoW)
   ========================================================== */

.wfrp-paperdoll .pd-effects {
  position: absolute;
  z-index: 2;
  top: 8px;
  right: 8px;
  left: 8px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 4px;
  pointer-events: none;
}
.wfrp-paperdoll .pd-effect {
  pointer-events: auto;
  position: relative;
  width: 30px;
  height: 30px;
  min-height: 0;
  margin: 0;
  padding: 0;
  border-radius: 3px;
  border: 1px solid #c0392b;
  background: var(--pd-well);
  box-shadow: 0 0 6px rgba(192, 57, 43, 0.6);
  cursor: pointer;
  overflow: visible;
}
.wfrp-paperdoll .pd-effect img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
  border-radius: 2px;
}
.wfrp-paperdoll .pd-effect--injury,
.wfrp-paperdoll .pd-effect--critical { border-color: #e67e22; box-shadow: 0 0 6px rgba(230, 126, 34, 0.6); }
.wfrp-paperdoll .pd-effect--disease { border-color: #8bc34a; box-shadow: 0 0 6px rgba(139, 195, 74, 0.55); }
.wfrp-paperdoll .pd-effect--effect { border-color: #9b59b6; box-shadow: 0 0 6px rgba(155, 89, 182, 0.6); }
.wfrp-paperdoll .pd-effect:hover { filter: brightness(1.25); }

/* Выключенный эффект: серый и перечёркнутый */
.wfrp-paperdoll .pd-effect.is-disabled { filter: grayscale(1); opacity: 0.55; box-shadow: none; border-color: #555; }
.wfrp-paperdoll .pd-effect.is-disabled::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 46%, #ff3b30 46%, #ff3b30 54%, transparent 54%);
}
.wfrp-paperdoll .pd-effect-value {
  position: absolute;
  right: -3px;
  bottom: -4px;
  min-width: 14px;
  padding: 0 3px;
  font-size: 10px;
  font-weight: 700;
  line-height: 13px;
  color: var(--pd-ink);
  background: #2a0f0c;
  border: 1px solid #c0392b;
  border-radius: 7px;
}
.wfrp-paperdoll-tooltip .pd-tt-name.is-debuff { color: var(--pd-bad); }

/* «Снять всё» в списке быстрой смены */
.wfrp-paperdoll-flyout .pd-fly-clear { margin-top: 6px; border-top: 1px solid var(--pd-frame); border-radius: 0 0 4px 4px; }
.wfrp-paperdoll-flyout .pd-fly-clear .pd-fly-icon {
  display: grid;
  place-items: center;
  color: var(--pd-text-dim);
  font-size: 16px;
  border-color: var(--pd-frame);
  box-shadow: none;
}
.wfrp-paperdoll-flyout .pd-fly-clear .pd-fly-name { color: var(--pd-text-2); }
.wfrp-paperdoll-flyout .pd-fly-clear:hover .pd-fly-icon { color: var(--pd-bad); }

/* Бонусы талантов */
.wfrp-paperdoll-flyout .pd-chip.is-good { color: var(--pd-good); background: rgba(30, 255, 0, 0.08); border-color: rgba(30, 255, 0, 0.35); }
.wfrp-paperdoll-tooltip .pd-tt-bonus { color: var(--pd-good); font-size: 12px; font-weight: normal; }
.wfrp-paperdoll-flyout .pd-fly-talents { padding: 5px 6px 0; font-size: 11px; color: var(--pd-good); }

/* ==========================================================
   Сумки: три слота и разделы по сумкам
   ========================================================== */

.wfrp-paperdoll .pd-bagbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px 4px;
}
.wfrp-paperdoll .pd-bagbar-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pd-gold-soft);
}
.wfrp-paperdoll .pd-bagbar-slots { display: flex; gap: 2px; }
.wfrp-paperdoll .pd-bagbar .pd-slot-frame { flex-basis: 44px; width: 44px; height: 44px; padding: 2px; }
.wfrp-paperdoll .pd-bagbar .pd-slot-placeholder { font-size: 16px; }
.wfrp-paperdoll .pd-bagbar .pd-swap { height: 32px; flex-basis: 14px; width: 14px; min-width: 14px; font-size: 9px; }

.wfrp-paperdoll .pd-bag-warn {
  margin: 0 10px 4px;
  padding: 4px 8px;
  font-size: 11px;
  color: var(--pd-warn);
  background: rgba(255, 120, 40, 0.1);
  border: 1px solid rgba(255, 140, 60, 0.4);
  border-radius: 3px;
}

.wfrp-paperdoll .pd-bag-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 2px 8px 10px;
}
.wfrp-paperdoll .pd-bagsec {
  margin-top: 8px;
  border: 1px solid var(--pd-frame);
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.3);
  transition: border-color 0.12s, box-shadow 0.12s, opacity 0.12s;
}
.wfrp-paperdoll .pd-bagsec.is-drop { border-color: var(--pd-gold); box-shadow: 0 0 10px rgba(255, 209, 0, 0.35); }
.wfrp-paperdoll .pd-bagsec.is-invalid { opacity: 0.45; }
.wfrp-paperdoll .pd-bagsec.is-over { border-color: #c0392b; }

.wfrp-paperdoll .pd-bagsec-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 4px;
}
.wfrp-paperdoll .pd-bagsec-icon {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  border: 1px solid var(--pd-frame);
  border-radius: 3px;
  object-fit: cover;
  display: grid;
  place-items: center;
  font-size: 12px;
  color: var(--pd-text-dim);
}
.wfrp-paperdoll .pd-bagsec-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.wfrp-paperdoll .pd-bagsec-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--pd-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfrp-paperdoll .pd-bagsec-slot { font-size: 10px; color: var(--pd-text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.wfrp-paperdoll .pd-bagsec-cap { font-size: 12px; font-weight: 700; color: var(--pd-text); font-variant-numeric: tabular-nums; }
.wfrp-paperdoll .pd-bagsec.is-full .pd-bagsec-cap { color: var(--pd-warn); }
.wfrp-paperdoll .pd-bagsec.is-over .pd-bagsec-cap { color: var(--pd-down); }

.wfrp-paperdoll .pd-bagsec-bar { height: 3px; margin: 0 8px 4px; background: var(--pd-well); border-radius: 2px; overflow: hidden; }
.wfrp-paperdoll .pd-bagsec-bar div { height: 100%; background: linear-gradient(90deg, #8a7040, #c9a45c); }
.wfrp-paperdoll .pd-bagsec.is-full .pd-bagsec-bar div { background: linear-gradient(90deg, #d08a1f, #ffb37a); }
.wfrp-paperdoll .pd-bagsec.is-over .pd-bagsec-bar div { background: linear-gradient(90deg, #7a1d14, #c0392b); }

.wfrp-paperdoll .pd-bagsec .pd-bag-grid {
  flex: none;
  overflow: visible;
  padding: 4px 8px 8px;
  grid-template-columns: repeat(auto-fill, 42px);
  grid-auto-rows: 42px;
  gap: 6px;
}
.wfrp-paperdoll .pd-bagsec .pd-bag-empty { padding: 6px 0; font-size: 12px; text-align: left; }
.wfrp-paperdoll .pd-bagsec--loose { border-style: dashed; }
.wfrp-paperdoll .pd-bagsec--stored .pd-bagsec-name { color: var(--pd-text-dim); }
.wfrp-paperdoll .pd-bagsec .pd-bag-grid:has(> .pd-bag-empty) { display: block; padding-top: 0; }

/* Кнопка «Разложить» в разделе «При себе» */
.wfrp-paperdoll .pd-pack {
  flex: 0 0 auto;
  width: auto;
  height: 22px;
  margin: 0;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 700;
  line-height: 20px;
  color: #1a140e;
  background: linear-gradient(180deg, #ffe066, #c99a00);
  border: 1px solid #c99a00;
  border-radius: 3px;
  box-shadow: none;
  cursor: pointer;
  white-space: nowrap;
}
.wfrp-paperdoll .pd-pack:hover { filter: brightness(1.1); }
.wfrp-paperdoll .pd-pack i { margin-right: 3px; }

/* ==========================================================
   Своя графика (assets/ui) - общая для обеих тем
   ========================================================== */

.wfrp-paperdoll-open img { width: 18px; height: 18px; border: none; vertical-align: middle; }

  background-size: 13px 13px;

.wfrp-paperdoll-flyout img.pd-fly-act { width: 16px; height: 16px; padding: 0; border: none; opacity: 0.7; }
.wfrp-paperdoll-flyout .pd-fly-row:hover img.pd-fly-act { opacity: 1; }
.wfrp-paperdoll-flyout .pd-fly-icon img { border: none; }
.wfrp-paperdoll-flyout .pd-fly-clear .pd-fly-icon img { width: 80%; height: 80%; margin: 10%; object-fit: contain; }
.wfrp-paperdoll-flyout img.pd-fly-bis {
  width: 30px;
  height: 30px;
  padding: 0;
  border: none;
  background: none;
  box-shadow: none;
  filter: drop-shadow(0 0 4px rgba(255, 209, 0, 0.6));
}
.wfrp-paperdoll-flyout .pd-fly-delta { display: inline-flex; align-items: center; gap: 2px; }
.wfrp-paperdoll-flyout .pd-fly-delta img,
.wfrp-paperdoll-flyout .pd-chip img { width: 12px; height: 12px; border: none; vertical-align: -1px; margin-right: 3px; }

/* ==========================================================
   Тема: тёмная (по умолчанию) - светлые рисунки затемняем
   ========================================================== */

.wfrp-paperdoll,
.wfrp-paperdoll-tooltip,
.wfrp-paperdoll-flyout {
  --pd-blend: multiply;
  --pd-hero-bg: linear-gradient(180deg, rgba(29, 24, 19, 0.85), rgba(17, 14, 11, 0.85));
  --pd-side-bg: rgba(0, 0, 0, 0.35);
  --pd-slot-well: radial-gradient(circle, #1c1814 0%, #0b0907 80%);
  --pd-silhouette: 0.65;
  --pd-badge-bg: #2c2620;
  --pd-panel-fill: ;
  --pd-statbox-bg: rgba(0, 0, 0, 0.55);
  --pd-tab-tint: #2a241c;
  --pd-tab-active-tint: #7a1a12;
  --pd-tab-active-text: #fff;
}

/* ==========================================================
   Тема: пергамент
   ========================================================== */

.wfrp-paperdoll.pd-theme-parchment,
.wfrp-paperdoll-tooltip.pd-theme-parchment,
.wfrp-paperdoll-flyout.pd-theme-parchment {
  --pd-bg: #d8d1c2;
  --pd-bg-2: #cdc4b1;
  --pd-panel: #e3ddd0;
  --pd-frame: #8f846c;
  --pd-frame-hi: #6f634c;
  --pd-gold: #7a4c08;
  --pd-gold-soft: #8a6a2a;
  --pd-text: #2a2119;
  --pd-text-dim: #5f5444;
  --pd-text-2: #3d3326;
  --pd-muted: #7a6e5a;
  --pd-ink: #1a140e;
  --pd-shadow: transparent;
  --pd-well: #b8b09e;
  --pd-tt-bg: #d6cfbf;
  --pd-fly-bg: #d6cfbf;

  --pd-up: #2f7a12;
  --pd-down: #a32014;
  --pd-fate: #1e6a8f;
  --pd-chaos: #6a1fa0;
  --pd-melee: #9a4a12;
  --pd-good: #2f7a12;
  --pd-bad: #a32014;
  --pd-warn: #8a4d08;
  --pd-rare-text: #1350a8;
  --pd-exotic-text: #6a1fa0;

  --rarity-none: #5f5a52;
  --rarity-common: #2a2119;
  --rarity-scarce: #2f7a12;
  --rarity-rare: #1350a8;
  --rarity-exotic: #6a1fa0;

  --pd-blend: normal;
  --pd-hero-bg: rgba(255, 255, 255, 0.18);
  --pd-side-bg: rgba(255, 255, 255, 0.12);
  --pd-slot-well: radial-gradient(circle, #cfc7b6 0%, #aaa190 85%);
  --pd-silhouette: 0.7;
  --pd-badge-bg: #e6dfcf;
  --pd-panel-fill: fill;
  --pd-statbox-bg: none;
  --pd-tab-tint: transparent;
  --pd-tab-active-tint: transparent;
  --pd-tab-active-text: #1a140e;
}

.pd-theme-parchment .pd-hero-name,
.pd-theme-parchment .pd-ecs-head,
.pd-theme-parchment.wfrp-paperdoll-tooltip *,
.pd-theme-parchment .pd-enc span { text-shadow: none; }
.pd-theme-parchment .pd-enc span { color: #1a140e; text-shadow: 0 0 3px rgba(255, 255, 255, 0.7); }
.pd-theme-parchment .pd-model { box-shadow: inset 0 0 30px rgba(60, 45, 25, 0.35); }
.pd-theme-parchment .pd-model::after { background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(60, 45, 25, 0.35) 100%); }
.pd-theme-parchment .pd-item,
.pd-theme-parchment .pd-item:hover,
.pd-theme-parchment .pd-item.rarity-exotic,
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-fly-icon { box-shadow: none; animation: none; }
.pd-theme-parchment .pd-item:hover { filter: brightness(1.08); }
.pd-theme-parchment .pd-swap { background: linear-gradient(90deg, #cbbf9f, #b9ac88); border-color: var(--pd-frame); }
.pd-theme-parchment .pd-swap:hover,
.pd-theme-parchment .pd-swap.is-open { background: #8a6a2a; border-color: #8a6a2a; }
.pd-theme-parchment .pd-select { background: linear-gradient(180deg, #e6dfcf, #cfc6b2); border-color: var(--pd-frame); }
.pd-theme-parchment .pd-select select option { background: #e6dfcf; color: var(--pd-text); }
.pd-theme-parchment .pd-filter { background: rgba(255, 255, 255, 0.35); }
.pd-theme-parchment .pd-filter.is-active { color: #f3ead6; background: #7a4c08; border-color: #7a4c08; }
.pd-theme-parchment .pd-bagsec { background: rgba(255, 255, 255, 0.2); }
.pd-theme-parchment .pd-bagsec-bar { background: rgba(0, 0, 0, 0.15); }
.pd-theme-parchment .pd-layers { color: #f3ead6; background-color: #8a6a2a; }
.pd-theme-parchment .pd-effect-value { color: #f3ead6; background: #7a1d14; }
.pd-theme-parchment .pd-bag-warn { background: rgba(160, 90, 20, 0.12); border-color: rgba(138, 77, 8, 0.45); }
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-fly-row:hover { background: rgba(122, 76, 8, 0.12); }
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-fly-row.is-bis {
  background: linear-gradient(90deg, rgba(122, 76, 8, 0.18), rgba(122, 76, 8, 0.02) 70%);
  box-shadow: inset 2px 0 0 #7a4c08;
}
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-chip.is-forbid { color: #f3ead6; background: #8b1a12; border-color: #8b1a12; }
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-chip.is-warn { background: rgba(138, 77, 8, 0.1); border-color: rgba(138, 77, 8, 0.4); }
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-chip.is-good { background: rgba(47, 122, 18, 0.1); border-color: rgba(47, 122, 18, 0.4); }
.wfrp-paperdoll-flyout.pd-theme-parchment .pd-chip.is-info { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.15); }
.wfrp-paperdoll-flyout.pd-theme-parchment img.pd-fly-bis { filter: drop-shadow(0 0 3px rgba(122, 76, 8, 0.5)); }

/* ---------- v0.10.1: деньги, контраст нагрузки, вкладки ---------- */

/* Деньги под именем: монеты по номиналам */
.wfrp-paperdoll .pd-money {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 3px;
  font-size: 13px;
  font-weight: 700;
  color: var(--pd-text);
}
.wfrp-paperdoll .pd-coin {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: help;
}
.wfrp-paperdoll .pd-coin::before {
  content: "";
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: inset 0 -2px 2px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.45);
}
.wfrp-paperdoll .pd-coin--gc::before { background: radial-gradient(circle at 35% 30%, #fff3a0, #e0b020 55%, #8a6408); }
.wfrp-paperdoll .pd-coin--ss::before { background: radial-gradient(circle at 35% 30%, #ffffff, #c8ccd0 55%, #6e7378); }
.wfrp-paperdoll .pd-coin--bp::before { background: radial-gradient(circle at 35% 30%, #ffd2a0, #c07a38 55%, #6a3a12); }

/* Текст нагрузки: белый с тёмной обводкой, читается на любой заливке */
.wfrp-paperdoll .pd-enc span,
.pd-theme-parchment .pd-enc span {
  font-weight: 700;
  color: #fff;
  -webkit-text-stroke: 0;
  text-shadow:
    -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
    0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
}

/* Активная вкладка: только рамка из tab-active.png (верх и бока), внутри прозрачно -
   видно тот же фон, что у панели под ней, а линия полосы вкладок под ней не рисуется */
.wfrp-paperdoll .pd-tabs {
  border-bottom: none;
  align-items: flex-end;
  box-shadow: inset 0 -1px 0 var(--pd-frame);
}
.wfrp-paperdoll .pd-tab.is-active {
  position: relative;
  height: 31px;
  background: transparent;

.wfrp-paperdoll .pd-tab.is-active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: var(--pd-tab-merge);
}
.wfrp-paperdoll { --pd-tab-merge: #070504; }
.wfrp-paperdoll.pd-theme-parchment { --pd-tab-merge: #beb8b4; }

/* Монеты: иконки самих предметов-денег */
.wfrp-paperdoll .pd-coin.has-img::before { display: none; }
.wfrp-paperdoll .pd-coin img { width: 18px; height: 18px; border: none; object-fit: contain; }

lass=\"pd-money\" title=\"{{localize \"WFRPPD.Money.Title\"}}. {{money.hint}}\">\n          {{#each money.parts}}\u003cspan class=\"pd-coin pd-coin--{{key}} {{#if img}}has-img{{/if}}\" title=\"{{title}}\">{{#if img}}\u003cimg src=\"{{img}}\" alt=\"\">{{/if}}{{value}}\u003c/span>{{/each}}\n        \u003c/div>\n        {{/if}}\n      \u003c/div>\n      {{#if careerIcon}}\n      \u003cdiv class=\"pd-hero-career\" title=\"{{careerIcon.title}}\">\n        \u003cimg src=\"{{careerIcon.img}}\" alt=\"\">\n      \u003c/div>\n      {{else}}\n      \u003cdiv class=\"pd-hero-career is-empty\">\u003c/div>\n      {{/if}}\n    \u003c/header>\n\n    \u003cdiv class=\"pd-doll\">\n      {{#each groups}}\n      \u003cdiv class=\"pd-group pd-group--{{area}}\">\n        {{#each slots}}\n        {{> pdSlot}}\n        {{/each}}\n      \u003c/div>\n      {{/each}}\n\n      \u003cdiv class=\"pd-center\">\n        \u003cdiv class=\"pd-model\" data-action=\"openSheet\">\n          \u003cimg src=\"{{img}}\" alt=\"{{name}}\">\n          {{#if effects.length}}\n          \u003cdiv class=\"pd-effects\">\n            {{#each effects}}\n            \u003cbutton type=\"button\" class=\"pd-effect pd-effect--{{kind}} {{#if disabled}}is-disabled{{/if}}\" data-index=\"{{@index}}\" aria-label=\"{{name}}\">\n              \u003cimg src=\"{{img}}\" alt=\"\">\n              {{#if value}}\u003cspan class=\"pd-effect-value\">{{value}}\u003c/span>{{/if}}\n            \u003c/button>\n            {{/each}}\n          \u003c/div>\n          {{/if}}\n          \u003cdiv class=\"pd-enc is-{{encumbrance.state}}\" title=\"{{localize \"WFRPPD.Encumbrance\"}}\">\n            \u003cdiv class=\"pd-enc-fill\" style=\"width: {{encumbrance.pct}}%\">\u003c/div>\n            \u003cspan>{{localize \"WFRPPD.Encumbrance\"}}: {{encumbrance.current}} / {{encumbrance.max}} · {{encumbrance.stateLabel}}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"pd-statboxes\">\n          {{#each statPanels}}\n          \u003cdiv class=\"pd-statbox\">\n            \u003clabel class=\"pd-select\">\n              \u003cselect data-panel=\"{{@index}}\">\n                {{#each options}}\u003coption value=\"{{key}}\" {{#if selected}}selected{{/if}}>{{label}}\u003c/option>{{/each}}\n              \u003c/select>\n              \u003cimg src=\"{{@root.art.caret}}\" alt=\"\">\n            \u003c/label>\n            \u003cdiv class=\"pd-statlist\">\n              {{#each rows}}\n              \u003cdiv class=\"pd-stat\" {{#if hint}}title=\"{{hint}}\"{{/if}}>\n                \u003cspan class=\"pd-stat-label\">{{label}}:\u003c/span>\n                \u003cspan class=\"pd-stat-value {{cls}}\">{{value}}\u003c/span>\n              \u003c/div>\n              {{/each}}\n            \u003c/div>\n          \u003c/div>\n          {{/each}}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"pd-side pd-bag\">\n    \u003cnav class=\"pd-tabs\">\n      \u003cbutton type=\"button\" class=\"pd-tab {{#if tabBag}}is-active{{/if}}\" data-action=\"setTab\" data-tab=\"bag\">\n        \u003cimg src=\"{{art.tabBag}}\" alt=\"\"> {{localize \"WFRPPD.Bag\"}}\n      \u003c/button>\n      \u003cbutton type=\"button\" class=\"pd-tab {{#if tabStats}}is-active{{/if}}\" data-action=\"setTab\" data-tab=\"stats\">\n        \u003cimg src=\"{{art.tabStats}}\" alt=\"\"> {{localize \"WFRPPD.StatsTab\"}}\n      \u003c/button>\n    \u003c/nav>\n\n    {{#if tabBag}}\n    \u003cdiv class=\"pd-bagbar\">\n      \u003cspan class=\"pd-bagbar-label\">{{localize \"WFRPPD.Bags.Worn\"}}\u003c/span>\n      \u003cdiv class=\"pd-bagbar-slots\">\n        {{#each bagSlots}}{{> pdSlot}}{{/each}}\n      \u003c/div>\n    \u003c/div>\n    {{#if bagOverflow}}\u003cdiv class=\"pd-bag-warn\">{{bagOverflow}}\u003c/div>{{/if}}\n\n    \u003cdiv class=\"pd-filters\">\n      {{#each filters}}\n      \u003cbutton type=\"button\" class=\"pd-filter {{#if active}}is-active{{/if}}\" data-action=\"setFilter\" data-filter=\"{{key}}\">\n        {{label}} \u003cspan class=\"pd-filter-count\">{{count}}\u003c/span>\n      \u003c/button>\n      {{/each}}\n    \u003c/div>\n\n    \u003cdiv class=\"pd-bag-list\">\n      {{#each bagSections}}\n      \u003csection class=\"pd-bagsec pd-bagsec--{{kind}} {{#if over}}is-over{{/if}} {{#if full}}is-full{{/if}}\" data-container=\"{{id}}\">\n        \u003cheader class=\"pd-bagsec-head\">\n          {{#if img}}\u003cimg class=\"pd-bagsec-icon\" src=\"{{img}}\" alt=\"\">{{else}}\u003cimg class=\"pd-bagsec-icon is-carried\" src=\"{{@root.art.carried}}\" alt=\"\">{{/if}}\n          \u003cdiv class=\"pd-bagsec-title\">\n            \u003cspan class=\"pd-bagsec-name\">{{name}}\u003c/span>\n            {{#if slotLabel}}\u003cspan class=\"pd-bagsec-slot\">{{slotLabel}}\u003c/span>{{/if}}\n          \u003c/div>\n          {{#if hasCap}}\u003cspan class=\"pd-bagsec-cap\" title=\"{{localize \"WFRPPD.Bags.CapHint\"}}\">{{used}} / {{cap}}\u003c/span>{{/if}}\n          {{#if looseWeight}}\u003cspan class=\"pd-bagsec-cap\" title=\"{{localize \"WFRPPD.Bags.LooseHint\"}}\">{{looseWeight}}\u003c/span>{{/if}}\n          {{#if canPack}}\n          \u003cbutton type=\"button\" class=\"pd-pack\" data-action=\"autoPack\" title=\"{{localize \"WFRPPD.Bags.PackHint\"}}\">\n            \u003cimg src=\"{{@root.art.pack}}\" alt=\"\"> {{localize \"WFRPPD.Bags.Pack\"}}\n          \u003c/button>\n          {{/if}}\n        \u003c/header>\n        {{#if hasCap}}\u003cdiv class=\"pd-bagsec-bar\">\u003cdiv style=\"width: {{pct}}%\">\u003c/div>\u003c/div>{{/if}}\n        \u003cdiv class=\"pd-bag-grid\">\n          {{#each items}}\n          \u003cdiv class=\"pd-item rarity-{{rarity}} {{#unless equippable}}is-plain{{/unless}}\" data-item-id=\"{{id}}\"\n               draggable=\"{{#if draggable}}true{{else}}false{{/if}}\">\n            \u003cimg src=\"{{img}}\" alt=\"{{name}}\">\n            {{#if qty}}\u003cspan class=\"pd-qty\">{{qty}}\u003c/span>{{/if}}\n          \u003c/div>\n          {{/each}}\n          {{#if empty}}\u003cdiv class=\"pd-bag-empty\">{{localize \"WFRPPD.Bags.Empty\"}}\u003c/div>{{/if}}\n        \u003c/div>\n      \u003c/section>\n      {{/each}}\n    \u003c/div>\n\n    {{else}}\n    \u003cdiv class=\"pd-ecs\">\n      {{#each statCategories}}\n      \u003cdiv class=\"pd-ecs-cat pd-ecs-cat--{{key}}\">\n        \u003cdiv class=\"pd-ecs-head\">{{#if art}}\u003cimg src=\"{{art}}\" alt=\"\">{{/if}}{{label}}\u003c/div>\n        {{#each rows}}\n        \u003cdiv class=\"pd-ecs-row\" {{#if hint}}title=\"{{hint}}\"{{/if}}>\n          \u003cspan class=\"pd-ecs-label\">{{label}}:\u003c/span>\n          \u003cspan class=\"pd-ecs-value {{cls}}\">{{value}}\u003c/span>\n        \u003c/div>\n        {{/each}}\n      \u003c/div>\n      {{/each}}\n    \u003c/div>\n    {{/if}}\n  \u003c/section>\n\n\u003c/div>\n"};

<script>/* ==========================================================
   Мини-«Foundry» для мока в браузере.
   Ровно столько API, сколько нужно настоящему коду модуля
   (scripts/paperdoll-app.js), чтобы он работал без Foundry.
   ========================================================== */
(() => {
  const LANG = window.__PD_LANG__;
  const SYS = window.__PD_SYSTEM_STRINGS__;

  const lookup = (key) => key.split(".").reduce((o, p) => (o == null ? undefined : o[p]), LANG);
  const i18n = {
    lang: "ru",
    has: (k) => typeof lookup(k) === "string" || k in SYS,
    localize: (k) => {
      const v = lookup(k);
      if (typeof v === "string") return v;
      return SYS[k] ?? k;
    },
    format: (k, data = {}) => i18n.localize(k).replace(/\{(\w+)\}/g, (_, x) => data[x] ?? "")
  };

  // --- Уведомления ---
  const toast = (msg, kind = "warn") => {
    const t = document.createElement("div");
    t.className = `mock-toast mock-toast--${kind}`;
    t.textContent = msg;
    document.body.append(t);
    setTimeout(() => t.remove(), 2400);
  };
  window.ui = { notifications: { warn: (m) => toast(m), error: (m) => toast(m), info: (m) => toast(m, "info") } };

  // --- Hooks ---
  const hooks = new Map();
  let hookId = 0;
  window.Hooks = {
    on(name, fn) {
      const id = ++hookId;
      if (!hooks.has(name)) hooks.set(name, new Map());
      hooks.get(name).set(id, fn);
      return id;
    },
    once(name, fn) {
      const id = this.on(name, (...a) => {
        this.off(name, id);
        fn(...a);
      });
      return id;
    },
    off(name, id) {
      hooks.get(name)?.delete(id);
    },
    call(name, ...args) {
      for (const fn of [...(hooks.get(name)?.values() ?? [])]) fn(...args);
    }
  };

  if (!Math.clamp) Math.clamp = (v, min, max) => Math.min(Math.max(v, min), max);

  // --- Handlebars ---
  Handlebars.registerHelper("localize", (k) => i18n.localize(k));
  const templates = {};
  for (const [path, src] of Object.entries(window.__PD_TEMPLATES__)) templates[path] = Handlebars.compile(src);

  // --- ApplicationV2 (минимум) ---
  class ApplicationV2 {
    constructor(options = {}) {
      const chain = [];
      let c = this.constructor;
      while (c && c !== Object && c !== Function.prototype) {
        if (Object.hasOwn(c, "DEFAULT_OPTIONS")) chain.unshift(c.DEFAULT_OPTIONS);
        c = Object.getPrototypeOf(c);
      }
      const merged = { actions: {}, window: {}, position: {}, classes: [] };
      for (const o of [...chain, options]) {
        Object.assign(merged.actions, o.actions ?? {});
        Object.assign(merged.window, o.window ?? {});
        Object.assign(merged.position, o.position ?? {});
        merged.classes.push(...(o.classes ?? []));
        if (o.id) merged.id = o.id;
      }
      this.options = merged;
      this.element = null;
      this.rendered = false;
    }

    get title() {
      return "";
    }

    async render() {
      const ctx = await this._prepareContext({});
      if (!this.element) this._buildFrame();
      const content = this.element.querySelector(".window-content");
      const scrollSel = Object.values(this.constructor.PARTS ?? {}).flatMap((p) => p.scrollable ?? []);
      const scroll = scrollSel.map((s) => [s, content.querySelector(s)?.scrollTop ?? 0]);
      const part = Object.values(this.constructor.PARTS)[0];
      content.innerHTML = templates[part.template](ctx);
      for (const [s, top] of scroll) {
        const el = content.querySelector(s);
        if (el) el.scrollTop = top;
      }
      this.element.querySelector(".window-title").textContent = this.title;
      this.rendered = true;
      await this._onRender(ctx, {});
      return this;
    }

    _buildFrame() {
      const el = document.createElement("div");
      el.className = ["app", "window-app", ...this.options.classes].join(" ");
      if (this.options.id) el.id = this.options.id;
      el.style.width = `${this.options.position.width}px`;
      el.style.height = `${this.options.position.height}px`;
      el.innerHTML = `
        <header class="window-header">
          <i class="window-icon ${this.options.window.icon ?? ""}"></i>
          <span class="window-title"></span>
          <button type="button" class="header-control" data-mock-close title="Закрыть"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <section class="window-content"></section>`;
      el.querySelector("[data-mock-close]").addEventListener("click", () => this.close());
      el.addEventListener("click", (ev) => {
        const target = ev.target.closest("[data-action]");
        if (!target || !el.contains(target)) return;
        const handler = this.options.actions[target.dataset.action];
        if (handler) handler.call(this, ev, target);
      });
      document.getElementById("mock-mount").append(el);
      this.element = el;
    }

    bringToFront() {}

    async close() {
      await this._onClose({});
      this.element?.remove();
      this.element = null;
      this.rendered = false;
      document.getElementById("mock-reopen").hidden = false;
    }

    async _prepareContext() {
      return {};
    }
    async _onRender() {}
    async _onClose() {}
  }

  const debounce = (fn, ms) => {
    let t;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };

  window.foundry = {
    applications: {
      api: { ApplicationV2, HandlebarsApplicationMixin: (Base) => class extends Base {} },
      ux: {
        TextEditor: {
          implementation: {
            getDragEventData(ev) {
              try {
                return JSON.parse(ev.dataTransfer.getData("text/plain"));
              } catch (e) {
                return {};
              }
            }
          }
        }
      }
    },
    utils: { debounce }
  };

  /* ---------- Фейковые документы ---------- */

  const setPath = (obj, path, value) => {
    const parts = path.split(".");
    let o = obj;
    for (const p of parts.slice(0, -1)) o = o[p] ??= {};
    o[parts.at(-1)] = value;
  };
  const flatten = (obj, prefix = "", out = {}) => {
    for (const [k, v] of Object.entries(obj)) {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, key, out);
      else out[key] = v;
    }
    return out;
  };

  const LOCS = ["head", "body", "rArm", "lArm", "rLeg", "lLeg"];
  const GROUP_SPEC = {
    basic: "basic", cavalry: "cavalry", fencing: "fencing", brawling: "brawling", flail: "flail", parry: "parry",
    polearm: "polearm", twohanded: "two-handed", blackpowder: "blackpowder", bow: "bow", crossbow: "crossbow",
    entangling: "entangling", engineering: "engineering", explosives: "explosives", sling: "sling", throwing: "throwing"
  };

  function makeSystem(item, data) {
    const sys = structuredClone(data);
    const type = item.type;
    const getters = {
      isPhysical: { get: () => ["armour", "weapon", "trapping", "container", "ammunition"].includes(type) },
      isEquippable: { get: () => ["armour", "weapon", "trapping", "container"].includes(type) },
      isEquipped: { get: () => !!sys.equipped?.value },
      canEquip: { get: () => type !== "trapping" || sys.trappingType?.value === "clothingAccessories" },
      // Как в системе: без навыка оружие ближнего боя теряет достоинства, цепы становятся опасными
      Qualities: { get: () => (type === "weapon" && !sys._ranged && item.parent._hasSkills && !sys.skillToUse ? [] : sys._qualities ?? []) },
      Flaws: {
        get: () => {
          const f = sys._flaws ?? [];
          const untrainedFlail = type === "weapon" && sys.weaponGroup?.value === "flail" && item.parent._hasSkills && !sys.skillToUse;
          return untrainedFlail && !f.includes("Опасное") ? [...f, "Опасное"] : f;
        }
      },
      properties: {
        get: () => ({ qualities: Object.fromEntries((sys._qualities ?? []).map((q) => [q.split(" ")[0].toLowerCase() === "щит" ? "shield" : q, true])) })
      }
    };
    if (type === "armour") {
      getters.protects = { get: () => Object.fromEntries(LOCS.map((l) => [l, (sys.AP?.[l] ?? 0) > 0])) };
      getters.currentAP = { get: () => sys.AP };
    }
    if (type === "weapon") {
      getters.isMelee = { get: () => !sys._ranged };
      getters.isRanged = { get: () => !!sys._ranged };
      getters.WeaponGroup = { get: () => `WFRP4E.GroupType.${sys.weaponGroup?.value}` };
      getters.Reach = { get: () => (sys._ranged ? null : `WFRP4E.Reach.${sys.reach?.value}`) };
      getters.Range = { get: () => sys._range ?? null };
      // Навык, которым владеет персонаж для этой группы (как getSkillToUse в системе)
      getters.skillToUse = {
        get: () => {
          const spec = GROUP_SPEC[sys.weaponGroup?.value];
          if (!spec) return undefined;
          return item.parent.items.find((i) => i.type === "skill" && i.name.toLowerCase().includes(`(${spec})`));
        }
      };
      getters.Damage = {
        get: () => {
          const sb = item.parent.system.characteristics.s.bonus;
          const f = String(sys.damage?.value || "0").replace("SB", sb);
          return f.split("+").reduce((a, b) => a + Number(b || 0), 0);
        }
      };
    }
    Object.defineProperties(sys, getters);
    return sys;
  }

  class FakeItem {
    constructor(actor, data) {
      this.parent = actor;
      this.id = data.id;
      this.uuid = `Actor.${actor.id}.Item.${data.id}`;
      this.name = data.name;
      this.img = data.img;
      this.type = data.type;
      this.system = makeSystem(this, data.system ?? {});
    }
    get actor() {
      return this.parent;
    }
    get sheet() {
      return { render: () => toast(`ПКМ: в Foundry тут откроется лист «${this.name}»`, "info") };
    }
    toDragData() {
      return { type: "Item", uuid: this.uuid };
    }
    async update(changes, { silent = false } = {}) {
      const flat = flatten(changes);
      // Как в системе: смена «надето» у оружия сбрасывает вторую руку
      if (this.type === "weapon" && "system.equipped.value" in flat && !("system.offhand.value" in flat))
        flat["system.offhand.value"] = false;
      for (const [k, v] of Object.entries(flat)) setPath(this, k, v);
      this.parent.prepare();
      if (!silent) Hooks.call("updateItem", this, changes);
      return this;
    }
  }

  class FakeEffect {
    constructor(actor, data) {
      this.parent = actor;
      this.id = data.id;
      this.name = data.name;
      this.img = data.img;
      this.description = data.description ?? "";
      this.statuses = new Set(data.statuses ?? []);
      this.disabled = !!data.disabled;
      this.conditionValue = data.value ?? null;
    }
    get sheet() {
      return { render: () => toast(`ПКМ: в Foundry тут откроется эффект «${this.name}»`, "info") };
    }
    async update(changes) {
      Object.assign(this, changes);
      Hooks.call("updateActor", this.parent, {});
      return this;
    }
    async delete() {
      const list = this.parent.effects;
      list.splice(list.indexOf(this), 1);
      Hooks.call("updateActor", this.parent, {});
    }
  }

  class FakeActor {
    constructor(data) {
      this.id = data.id;
      this.uuid = `Actor.${data.id}`;
      this.name = data.name;
      this.img = data.img;
      this.type = "character";
      this.isOwner = true;
      this.system = structuredClone(data.system);
      // Навыки и таланты - обычные предметы актёра, как в Foundry
      const extra = [
        ...(data.skills ?? []).map((name, i) => ({ id: `skill-${i}`, name, type: "skill", system: {} })),
        ...(data.talents ?? []).map((t, i) => ({ id: `talent-${i}`, name: t.name ?? t, type: "talent", system: { advances: { value: t.advances ?? 1 } } })),
        ...(data.spells ?? []).map((name, i) => ({ id: `spell-${i}`, name, type: "spell", system: {} }))
      ];
      this._hasSkills = extra.some((e) => e.type === "skill");
      const arr = [...data.items, ...extra].map((d) => new FakeItem(this, d));
      arr.get = (id) => arr.find((i) => i.id === id);
      this.items = arr;
      const effects = (data.effects ?? []).map((e) => new FakeEffect(this, e));
      effects.get = (id) => effects.find((e) => e.id === id);
      this.effects = effects;
      this.career = data.career;
      const actor = this;
      Object.defineProperties(this.system, {
        currentCareer: {
          get: () => ({
            name: actor.career.name,
            img: actor.career.img,
            system: { level: { value: actor.career.level }, class: { value: actor.career.class } }
          })
        },
        equipPointsUsed: {
          get: () => actor.items.filter((i) => i.type === "weapon" && i.system.isEquipped).reduce((n, w) => n + (w.system.twohanded?.value ? 2 : 1), 0)
        }
      });
      this.prepare();
    }
    get itemTypes() {
      const out = {};
      for (const i of this.items) (out[i.type] ??= []).push(i);
      return out;
    }
    get sheet() {
      return { render: () => toast("В Foundry тут откроется лист персонажа", "info") };
    }
    /** Как в системе: снять N уровней состояния, на нуле состояние исчезает */
    async removeCondition(key, value = 1) {
      const effect = this.effects.find((e) => e.statuses.has(key));
      if (!effect) return;
      const left = (effect.conditionValue ?? 1) - value;
      if (left > 0 && effect.conditionValue) await effect.update({ conditionValue: left });
      else await effect.delete();
    }
    async updateEmbeddedDocuments(type, updates) {
      for (const u of updates) {
        const { _id, ...rest } = u;
        await this.items.get(_id)?.update(rest, { silent: true });
      }
      Hooks.call("updateActor", this, {});
    }
    /** Пересчёт как в системе: AP по локациям и нагрузка */
    prepare() {
      const s = this.system;
      for (const c of Object.values(s.characteristics)) {
        if (c.initial !== undefined) c.value = c.initial + (c.modifier || 0) + (c.advances || 0);
        c.bonus ??= Math.floor(c.value / 10);
        if (c.initial !== undefined) c.bonus = Math.floor(c.value / 10);
      }
      s.status.armour = {};
      for (const l of LOCS) s.status.armour[l] = { value: 0 };
      let enc = 0;
      for (const i of this.items) {
        const sys = i.system;
        if (!sys.isPhysical) continue;
        // Как в системе: AP считается по всей надетой броне, где бы она ни «лежала»
        if (i.type === "armour" && sys.isEquipped) for (const l of LOCS) s.status.armour[l].value += sys.AP?.[l] ?? 0;
        // Как в системе: вещи внутри контейнеров не считаются в нагрузку напрямую, только сам контейнер
        if (sys.location?.value) {
          sys.encumbrance.total = (sys.encumbrance?.value ?? 0) * (sys.quantity?.value ?? 1);
          continue;
        }
        let e = (sys.encumbrance?.value ?? 0) * (sys.quantity?.value ?? 1);
        if (sys.isEquipped && ["armour", "trapping"].includes(i.type)) e = Math.max(0, e - 1);
        sys.encumbrance.total = e;
        enc += e;
      }
      s.status.encumbrance.current = Math.round(enc * 100) / 100;
      s.status.encumbrance.max = s.characteristics.s.bonus + s.characteristics.t.bonus;
    }
  }

  window.__PD_makeActor__ = (data) => {
    const actor = new FakeActor(data);
    window.fromUuid = async (uuid) => actor.items.find((i) => i.uuid === uuid) ?? null;
    return actor;
  };

  window.game = {
    i18n,
    user: { isGM: false },
    wfrp4e: { config: window.__PD_CONFIG__ },
    // Настройки модуля: тема и свои иконки
    settings: {
      _values: { "wfrp4e-paperdoll.theme": "dark", "wfrp4e-paperdoll.itemIcons": true },
      get(ns, key) {
        return this._values[`${ns}.${key}`];
      },
      async set(ns, key, value) {
        this._values[`${ns}.${key}`] = value;
        window.PaperdollApp?.renderAll?.();
        return value;
      }
    }
  };
  game.modules = new Map([["wfrp4e-paperdoll", {}]]);
})();

/**

 * (сапоги с картинкой кожаной куртки, кольцо с общей заглушкой). Название точнее пути.
 * Порядок важен: первое совпадение побеждает.
 */
const NAME_ICON_RULES = [
  [/сапог|ботин|\bboots?\b/i, "equipment/clothing_and_accessories/boots.png"],
  [/туфл|башмак|\bshoes?\b/i, "equipment/clothing_and_accessories/shoes.png"],
  [/перчат|рукавиц|\bgloves?\b|gauntlet/i, "equipment/clothing_and_accessories/gloves.png"],
  [/плащ|накидк|\bcloak\b|\bcape\b/i, "equipment/clothing_and_accessories/cloak.png"],
  [/капюшон|\bhood\b/i, "equipment/clothing_and_accessories/hood.png"],
  [/шляп|берет|\bhat\b|\bcap\b/i, "equipment/clothing_and_accessories/hat.png"],
  [/мантия|\bроб[аы]\b|\brobes?\b/i, "equipment/clothing_and_accessories/robes.png"],
  [/кольц|перстен|\bring\b/i, "equipment/clothing_and_accessories/signet-ring.png"],
  [/амулет|талисман|\bamulet\b|\btalisman\b/i, "equipment/clothing_and_accessories/amulet.png"],
  [/оникс|самоцвет|драгоцен|изумруд|рубин|сапфир|\bonyx\b|\bgem|\bjewel/i, "equipment/clothing_and_accessories/jewellery.png"],
  [/маска|\bmask\b/i, "equipment/clothing_and_accessories/mask.png"],
  [/одежд|\bclothes\b|\bclothing\b/i, "equipment/clothing_and_accessories/clothing.png"],
  [/гримуар|\bgrimoire\b|spellbook/i, "equipment/book_documents/book-magic.png"],
  [/свиток|\bscroll\b/i, "equipment/book_documents/parchmentsheet.png"]
];

/** Вариант предмета (-fine, -flaw, dagger2) -> путь базового предмета */
const baseVariant = (rel) => rel.replace(/(-(fine|flaw)(-?\d+)?|\d+)(\.\w+)$/, "$4");

/**
 * Путь своей иконки относительно assets/icons или null.
 * @param {string} rel   путь картинки предмета относительно modules/wfrp4e-core/icons/
 * @param {string} name  название предмета
 * @param {Set<string>} has  какие иконки есть в assets/icons
 */
function ownIconFor(rel, name, has) {
  for (const [re, icon] of NAME_ICON_RULES) if (re.test(name ?? "") && has.has(icon)) return icon;
  if (has.has(rel)) return rel;
  const base = baseVariant(rel);
  return base !== rel && has.has(base) ? base : null;
}

/* -------------------------------------------- */
/*  Расшифровка сокращений: «6 ЗК» -> «6 золотых крон (ЗК)»   */
/* -------------------------------------------- */

function plural(n, forms) {
  const a = Math.abs(Math.trunc(n)) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b === 1) return forms[0];
  if (b >= 2 && b <= 4) return forms[1];
  return forms[2];
}

/** Сокращение -> [формы слова для 1/2/5, как подписать сокращение] */
const TERMS = [
  [/(ЗК|зк|GC)/, (n) => `${plural(n, game.i18n.localize("WFRPPD.Terms.gc").split("|"))} (ЗК)`],
  [/(СШ|сш|SS)/, (n) => `${plural(n, game.i18n.localize("WFRPPD.Terms.ss").split("|"))} (СШ)`],
  [/(П|п|BP)/, (n) => `${plural(n, game.i18n.localize("WFRPPD.Terms.bp").split("|"))} (П)`],
  [/(УУ|SL)/, (n) => `${plural(n, game.i18n.localize("WFRPPD.Terms.sl").split("|"))} (УУ)`]
];

/** «-2 УУ» -> «-2 уровня успеха (УУ)», «6 ЗК» -> «6 золотых крон (ЗК)» */
function humanizeTerms(text) {
  let out = String(text ?? "");
  for (const [abbr, word] of TERMS) {
    const re = new RegExp(`([+\\-–]?\\d+)\\s*${abbr.source}(?![\\p{L}])`, "gu");
    out = out.replace(re, (_, num) => `${num} ${word(Number(num.replace("–", "-")))}`);
  }
  return out;
}

/**
 * Разворачивает служебную разметку Foundry в обычный текст:
 *   [[/r 1d10]]           -> 1d10
 *   [[/r 1d10]]{подпись}  -> подпись
 *   @Pay[6зк]{6 ЗК}       -> 6 ЗК
 *   @Condition[устал]     -> устал
 *   @UUID[...]{Имя}       -> Имя
 */
function plainEnrichers(text) {
  return String(text ?? "")
    .replace(/\[\[\s*\/(?:r|roll|gmr|br|pr)\s+([^\]]+?)\s*\]\](?:\{([^}]*)\})?/gi, (_, f, label) => label || f)
    .replace(/\[\[\s*([^\]]+?)\s*\]\](?:\{([^}]*)\})?/g, (_, f, label) => label || f)
    .replace(/@\w+\[([^\]]*)\](?:\{([^}]*)\})?/g, (_, ref, label) => label || ref.split(".").pop());
}

/**
 * Разбирает описание предмета для тултипа:
 * абзацы вида «<strong>Метка:</strong> значение» -> строки свойств,
 * остальное -> текст. Таблицы в тултип не тащим, только помечаем.
 */
const PRICE_LABEL = /цен|стоимост|price|cost/i;

function parseDescription(html, { hidePrices = false } = {}) {
  const root = document.createElement("div");
  // Для игроков ссылки на оплату (@Pay[...]) превращаем в пустоту ещё до разбора
  root.innerHTML = hidePrices ? String(html ?? "").replace(/@Pay\[[^\]]*\](?:\{[^}]*\})?/gi, "") : html ?? "";
  const hasTable = !!root.querySelector("table");
  root.querySelectorAll("table").forEach((t) => t.remove());
  const clean = (t) => plainEnrichers(t).replace(/\s+/g, " ").trim();

  const props = [];
  const text = [];
  const blocks = root.querySelectorAll("p, li, h1, h2, h3, h4, blockquote");
  const nodes = blocks.length ? [...blocks] : [root];
  for (const node of nodes) {
    const strong = node.querySelector("strong, b");
    const full = clean(node.textContent);
    if (!full) continue;
    if (strong && node.textContent.trim().startsWith(strong.textContent.trim()) && /:\s*$/.test(strong.textContent.trim())) {
      const label = clean(strong.textContent).replace(/:\s*$/, "");
      const value = clean(full.slice(full.indexOf(":") + 1));
      if (label && hidePrices && PRICE_LABEL.test(label)) continue;
      if (label && value) {
        props.push([label, value]);
        continue;
      }
    }
    text.push(full);
  }
  return { props, text: text.join(" "), hasTable };
}

function stripTags(html) {
  const div = document.createElement("div");
  div.innerHTML = html ?? "";
  return (div.textContent ?? "").replace(/\s+/g, " ").trim();
}

function sys(doc) {
  return doc?.system ?? {};
}

function safe(fn, fallback = null) {
  try {
    return fn();
  } catch (e) {
    return fallback;
  }
}
