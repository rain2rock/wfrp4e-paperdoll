# Сборка релиза для Foundry: при каждом пуше в main с новой версией в module.json
# создаётся релиз vX.Y.Z с module.json и module.zip.
# Ссылка для установки (Manifest URL) всегда одна:
# https://github.com/rain2rock/wfrp4e-paperdoll/releases/latest/download/module.json
name: Release

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module.zip
        if: steps.exists.outputs.skip != 'true'
        run: |
          zip -r module.zip module.json README.md scripts styles templates lang assets

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" module.json module.zip \
            --title "v${{ steps.v.outputs.version }}" --generate-notes --latest
