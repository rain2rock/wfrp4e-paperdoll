# Сборка релиза для Foundry: при каждом пуше в main с новой версией в module.json
# создаётся релиз vX.Y.Z: ядро (module.json + module.zip) и каждое дополнение из addons/<id>
# (wfrp4e-paperdoll-<id>.json + wfrp4e-paperdoll-<id>.zip). Версия дополнений = версия ядра.
# Manifest URL ядра: https://github.com/rain2rock/wfrp4e-paperdoll/releases/latest/download/module.json
# Дополнения: https://github.com/rain2rock/wfrp4e-paperdoll/releases/latest/download/wfrp4e-paperdoll-<id>.json
name: Release

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module.zip and add-ons
        if: steps.exists.outputs.skip != 'true'
        run: |
          V="${{ steps.v.outputs.version }}"
          # Единый пакет: дополнения внутри module.zip (их манифесты в zip не нужны - грузит ядро)
          zip -r module.zip module.json README.md scripts styles templates lang assets addons -x 'addons/*/module.json'
          mkdir -p dist
          for dir in addons/*/; do
            id="$(basename "$dir")"
            name="wfrp4e-paperdoll-$id"
            jq --arg v "$V" '.version = $v | .relationships.requires[0].compatibility.minimum = $v' "$dir/module.json" > "dist/$name.json"
            cp "dist/$name.json" "$dir/module.json"
            (cd "$dir" && zip -r "../../dist/$name.zip" .)
          done

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" module.json module.zip dist/* \
            --title "v${{ steps.v.outputs.version }}" --generate-notes --latest
